# netviz, without installing netviz.
#
#     docker compose run --rm netviz validate      # the CLI, one shot
#     docker compose up web                          # the browser editor, :8081
#     docker compose up watch                        # the live preview, :8080
#
# All three are the same image (built from ./Dockerfile) over the same mount:
# they differ only in what they ask netviz to do with it. The inventory they
# read is ``examples/home-lab`` from this checkout unless NETVIZ_INVENTORY says
# otherwise, so a fresh clone can render something before it has a network of its
# own described. Every variable used below has a default -- ``docker compose up``
# needs no ``.env`` -- and ``.env.example`` lists them with what they do.
#
# docs/docker.md is the long version: mounting your own tree, writing files back
# out, publishing the ports, and what to do when a bind mount delivers no
# filesystem events.

name: netviz

# --------------------------------------------------------------------------- #
# What every service shares
# --------------------------------------------------------------------------- #
x-environment: &environment
  # Which YAML parser to use, ``auto`` (libyaml when the wheel carries it) or
  # ``python``. The same switch CI flips; see docs/testing.md.
  NETVIZ_YAML_LOADER: "${NETVIZ_YAML_LOADER:-auto}"

x-netviz: &netviz
  build:
    context: .
    dockerfile: Dockerfile
  image: netviz:local
  # PID 1 in this container is netviz itself, and a Python process that has
  # installed no SIGTERM handler ignores it when it is PID 1 -- so without an
  # init, ``docker compose down`` waits out the grace period and kills the
  # container. tini reaps and forwards instead.
  init: true
  # Files this container writes -- a render, a formatted document -- land in a
  # directory on the host, so they must land owned by the person who asked for
  # them rather than by root. Override both when your ids are not 1000; ``id -u``
  # and ``id -g`` say what they are.
  user: "${NETVIZ_UID:-1000}:${NETVIZ_GID:-1000}"
  # netviz reads YAML and writes a diagram. It needs no privilege to do that,
  # and an inventory is exactly the kind of file worth being careful with.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    # Graphviz and fontconfig want somewhere to write; HOME and XDG_CACHE_HOME
    # point here (see Dockerfile), which is the whole of the writable filesystem
    # apart from the inventory mount.
    - /tmp
  environment: *environment

x-inventory-ro: &inventory-ro
  # A preview and an editor only ever read. Mounting read-only means a
  # misconfigured container cannot rewrite the tree it is drawing.
  - "${NETVIZ_INVENTORY:-./examples/home-lab}:/inventory:ro"

services:
  # ------------------------------------------------------------------------- #
  # The CLI, one command at a time
  # ------------------------------------------------------------------------- #
  #     docker compose run --rm netviz validate
  #     docker compose run --rm netviz list devices
  #     docker compose run --rm netviz render -f svg -o topology.svg
  #     docker compose run --rm netviz export hosts
  #
  # Everything after the service name is netviz's own argument list, because
  # the image's entrypoint is the ``netviz`` executable. Data goes to stdout
  # and commentary to stderr as it does anywhere else, so ``… render -f json |
  # jq`` works through compose too.
  netviz:
    <<: *netviz
    # Under a profile so that ``docker compose up`` -- which brings up the two
    # servers -- does not also start a one-shot command and report it as a
    # container that exited. ``compose run`` enables the profile itself.
    profiles:
      - cli
    volumes:
      # Read-write, unlike the servers: ``render -o``, ``fmt``, ``export -o``,
      # ``init`` and ``import`` all write into the tree.
      - "${NETVIZ_INVENTORY:-./examples/home-lab}:/inventory:rw"
    command:
      - --help

  # ------------------------------------------------------------------------- #
  # The browser editor
  # ------------------------------------------------------------------------- #
  #     docker compose up web    ->  http://127.0.0.1:8081/
  #
  # Edit YAML on the left, watch the diagram redraw on the right. Nothing it
  # renders is written anywhere: the stream lives in the browser, which is why
  # this service can hold the inventory read-only and still be useful -- the tree
  # is only the seed.
  web:
    <<: *netviz
    volumes: *inventory-ro
    command:
      - web
      # 0.0.0.0 inside the container, not on the host: the published port below
      # is what decides who can reach it. A container's loopback is its own, so
      # binding netviz to 127.0.0.1 here would make it unreachable from
      # anywhere, including the machine running Docker.
      - --host
      - 0.0.0.0
      # There is no browser in here to open.
      - --no-open
      - --icons
      - "${NETVIZ_ICONS:-none}"
    ports:
      # Published on loopback by default, for the reason netviz itself binds
      # to loopback by default: an inventory describes internal topology, and
      # putting it on the network is a decision, not a default. Set
      # NETVIZ_BIND=0.0.0.0 to make it one.
      - "${NETVIZ_BIND:-127.0.0.1}:${NETVIZ_WEB_PORT:-8081}:8081"
    healthcheck:
      # No curl in the image, and no need for one: the interpreter that serves
      # the page can ask it for itself.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8081/", timeout=3).read(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------------- #
  # The live preview
  # ------------------------------------------------------------------------- #
  #     docker compose up watch  ->  http://127.0.0.1:8080/
  #
  # Re-renders the mounted tree whenever a file in it changes and serves the
  # result on a page that reloads itself, with one status line per cycle in
  # ``docker compose logs``. A cycle that fails keeps the previous diagram up, so
  # a half-typed document never blanks the picture.
  watch:
    <<: *netviz
    volumes: *inventory-ro
    command:
      - watch
      - --serve
      - --host
      - 0.0.0.0
      # l1 physical, l2 with VLANs, l3 subnets, overlay tunnels, rack elevation.
      - --layer
      - "${NETVIZ_LAYER:-l1}"
      - --icons
      - "${NETVIZ_ICONS:-none}"
    ports:
      - "${NETVIZ_BIND:-127.0.0.1}:${NETVIZ_WATCH_PORT:-8080}:8080"
    environment:
      <<: *environment
      # A bind mount does not always deliver filesystem events -- Docker Desktop
      # on macOS and Windows, and anything reached over NFS or a VM boundary. Set
      # this to 1 there and the watcher polls instead. Empty means "decide from
      # the platform", which is what watchfiles does natively.
      WATCHFILES_FORCE_POLLING: "${WATCHFILES_FORCE_POLLING:-}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/status.json", timeout=3).read(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
