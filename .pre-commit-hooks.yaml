# Hooks this repository offers to other repositories.
#
# Not to be confused with .pre-commit-config.yaml, which is the set of hooks
# netgraph runs on *itself*. This file is the public one: it is what
#
#   repos:
#     - repo: https://github.com/blechschmidt/netgraph
#       rev: v0.1.0
#       hooks:
#         - id: netgraph-validate
#
# resolves to in somebody else's inventory repository.
#
# ``docs/ci.md`` has the full write-up, including how to point the hook at an
# inventory that does not sit at the repository root.

- id: netgraph-validate
  name: netgraph validate
  description: >-
    Check a netgraph YAML inventory for schema and semantic problems before the
    commit lands, with the same rules ``netgraph validate`` applies in CI.
  entry: netgraph validate
  language: python
  # The hook validates the tree as a whole -- a cable is only dangling when
  # compared against the devices in the other files -- so it takes no
  # filenames. This pattern therefore decides *whether* to run, not what to run
  # on: a commit touching no YAML cannot have broken the inventory.
  files: \.ya?ml$
  pass_filenames: false
  # One inventory, one process. Without this pre-commit may run the hook in
  # several workers, each loading the whole tree to report the same findings.
  require_serial: true

- id: netgraph-fmt
  name: netgraph fmt
  description: >-
    Rewrite netgraph YAML into the canonical form of ``docs/format.md``, so
    that how a file is laid out is never what a review is spent on.
  entry: netgraph fmt
  language: python
  files: \.ya?ml$
  # Unlike netgraph-validate, this hook *does* take filenames. Formatting is a
  # per-file operation, so a commit touching one document has no reason to walk
  # the whole tree, and ``fmt`` accepts a list of paths exactly as it accepts a
  # folder. Discovery still applies to each: a path a ``.netgraphignore``
  # excludes is skipped even when it is named outright.
  pass_filenames: true
  # ``fmt`` rewrites in place, which is the point of running it here: the files
  # come back fixed and ``git add`` is the whole remedy. pre-commit notices the
  # modification and fails the commit regardless of the exit status, so nothing
  # reformatted can slip through unreviewed.
  require_serial: true

- id: netgraph-fmt-check
  name: netgraph fmt --check
  description: >-
    Report netgraph YAML that is not in canonical form, changing nothing. For
    repositories that would rather see the failure than have files rewritten
    underneath them.
  entry: netgraph fmt --check
  language: python
  files: \.ya?ml$
  pass_filenames: true
  require_serial: true
