<script>/* One detail record, drawn.
 *
 * The records come from netgraph.render.details.build_details -- the JSON
 * export plus an element id and a links cross-reference -- and two front ends
 * show them: the info box of `netgraph web`, and the detail panel of the
 * self-contained page `netgraph render -f html` writes. The records are built
 * once in Python for exactly the reason this file exists in one copy: two
 * views of one inventory that disagree about what a device is are worse than
 * one view.
 *
 * Everything a record contains is inserted with textContent. This file assigns
 * no markup at all -- not innerHTML, not insertAdjacentHTML -- so a name, a
 * description or a label carrying markup is text wherever it lands, and there
 * is no escaping contract for a caller to get wrong.
 */

var netgraphDetail = (function () {
  "use strict";

  /* -------------------------------------------------------------- helpers */

  function element(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined && text !== null) { node.textContent = String(text); }
    return node;
  }

  function definitions(pairs) {
    var list = document.createElement("dl");
    pairs.forEach(function (pair) {
      if (pair[1] === undefined || pair[1] === null || pair[1] === "") { return; }
      list.appendChild(element("dt", null, pair[0]));
      list.appendChild(element("dd", null, pair[1]));
    });
    return list.children.length ? list : null;
  }

  function section(title, body) {
    if (!body) { return null; }
    var wrapper = document.createElement("section");
    wrapper.appendChild(element("h3", null, title));
    wrapper.appendChild(body);
    return wrapper;
  }

  function table(headings, rows) {
    if (!rows.length) { return null; }
    var node = document.createElement("table");
    var head = document.createElement("tr");
    headings.forEach(function (heading) { head.appendChild(element("th", null, heading)); });
    node.appendChild(head);
    rows.forEach(function (row) {
      var line = document.createElement("tr");
      if (row.muted) { line.className = "off"; }
      row.cells.forEach(function (cell) { line.appendChild(element("td", null, cell)); });
      node.appendChild(line);
    });
    return node;
  }

  function tags(values) {
    if (!values || !values.length) { return null; }
    var wrapper = document.createElement("div");
    values.forEach(function (value) { wrapper.appendChild(element("span", "tag", value)); });
    return wrapper;
  }

  function join(values) {
    return values && values.length ? values.join(", ") : "";
  }

  function append(parent, child) {
    if (child) { parent.appendChild(child); }
  }

  /* --------------------------------------------------------------- record */

  /** Which columns to draw. The defaults are "everything the record holds":
   *  a record was already narrowed in Python by the options the diagram was
   *  rendered with, and a front end offering a live toggle narrows it again. */
  function settings(options) {
    var given = options || {};
    return {
      showIps: given.showIps !== false,
      showVlans: given.showVlans !== false,
      hint: given.hint || ""
    };
  }

  function heading(record, name, kind, view) {
    var head = element("h2", null, name);
    head.appendChild(element("span", "kind", "[" + kind + "]"));
    if (view.hint) { head.appendChild(element("span", "pinhint", view.hint)); }
    return head;
  }

  // A tunnel is the one record where the interesting facts are neither
  // physical nor addressing: what it encapsulates, what carries it, and -- the
  // one a reader most needs -- whether anything in the stack encrypts.
  function tunnelSection(tunnel) {
    if (!tunnel) { return null; }
    var protection = tunnel.encrypted
      ? "yes" + (tunnel.cipher ? " (" + tunnel.cipher + ")" : "")
      : (tunnel.encryptedBy ? "by " + tunnel.encryptedBy : "no — cleartext");
    return section("tunnel", definitions([
      ["stack", tunnel.stack.join(" over ")],
      ["carries", "layer " + tunnel.layer],
      ["transport", tunnel.transport + (tunnel.port ? "/" + tunnel.port : "")],
      ["mode", tunnel.mode],
      ["vni", tunnel.vni],
      ["encrypted", protection],
      ["auth", tunnel.auth],
      ["mtu", tunnel.mtu ? tunnel.mtu + " (overhead " + tunnel.overheadBytes + " B)" : ""],
      ["over", tunnel.over]
    ]));
  }

  function describeNode(record, view) {
    var box = document.createDocumentFragment();
    box.appendChild(heading(record, record.name, record.kind, view));

    var identity = [["id", record.id]];
    if (record.namespace) { identity.push(["namespace", record.namespace]); }
    if (record.description) { identity.push(["description", record.description.trim()]); }
    Object.keys(record.labels || {}).forEach(function (key) {
      identity.push(["label " + key, record.labels[key]]);
    });
    append(box, section("element", definitions(identity)));

    if (record.subnet) {
      append(box, section("subnet", definitions([
        ["prefix", record.subnet.prefix],
        ["family", record.subnet.family],
        ["addresses", view.showIps ? join(record.subnet.addresses) : ""],
        ["elements", join(record.subnet.elements)]
      ])));
    }

    append(box, tunnelSection(record.tunnel));

    if (view.showVlans) {
      append(box, section("vlans", tags((record.vlans || []).map(function (id) {
        return "vlan " + id;
      }))));
    }

    append(box, section("interfaces", table(
      ["interface", "type", "addresses", "vlan", "mac / mtu"],
      (record.interfaces || []).map(function (port) {
        return {
          muted: port.enabled === false,
          cells: [
            port.name,
            port.type,
            view.showIps ? join(port.addresses) : "",
            view.showVlans && port.vlan ? port.vlan.mode + " " + join(port.vlan.vlans) : "",
            [port.mac, port.mtu ? "mtu " + port.mtu : ""].filter(Boolean).join(" / ")
          ]
        };
      })
    )));

    append(box, section("links", table(
      ["via", "to", "port", "medium", "vlan"],
      (record.links || []).map(function (link) {
        return {
          cells: [
            link.interface || "—",
            link.peer,
            link.peerInterface || "—",
            [link.stack || link.medium || link.kind, link.speedText].filter(Boolean).join(" "),

      ["medium", record.medium],
      ["speed", record.speedText],
      ["label", record.label],
      ["length", record.lengthM ? record.lengthM + " m" : ""],
      ["addresses", view.showIps ? join(record.addresses) : ""]

    append(box, section("endpoints", table(["element", "interface"], ends.map(function (end) {

    (record.addresses || []).forEach(function (address) { parts.push(address); });
    Object.keys(record.labels || {}).forEach(function (key) {
      parts.push(key, record.labels[key]);

    if (record.subnet) {
      parts.push(record.subnet.prefix, record.subnet.family);
      (record.subnet.addresses || []).forEach(function (address) { parts.push(address); });

    if (record.tunnel) {
      parts.push(record.tunnel.type, record.tunnel.transport, record.tunnel.cipher);
      (record.tunnel.stack || []).forEach(function (layer) { parts.push(layer); });

    return (record.endpoints || []).map(function (end) {
      return end.node + (end.interface ? ":" + end.interface : "");
    }).join(" — ");

  return {
    append: append,
    definitions: definitions,
    describe: describe,
    element: element,
    haystack: haystack,
    join: join,
    label: label,
    section: section,
    table: table,
    tags: tags

/* The client of the self-contained page `netgraph render -f html` writes.
 *
 * Hand-written, dependency-free and inlined into the document at render time.
 * There is no build step and no framework on purpose: the output of this
 * renderer is a file you email, commit or publish, and every byte of runtime
 * in it is a byte the reader downloads to look at a network diagram.
 *
 * What is on the page when this runs:
 *
 *   - one <div class="view"> per rendering, each holding an <svg> Graphviz
 *     laid out. Several exist when the document holds more than one layer, or
 *     when the address and VLAN annotations can be turned off -- switching is
 *     showing a different one, never a re-layout, because a browser cannot lay
 *     a graph out and this page carries no layout engine;
 *   - a <script type="application/json"> holding one record per drawn element,
 *     keyed by the id the shape carries (--element-ids). That is the same
 *     structure `netgraph render -f json` exports and the same one the web
 *     preview's info boxes use.
 *
 * Everything below is reading those two and moving classes around. No markup
 * is ever assigned -- no innerHTML, no document.write, no new Function -- so
 * the page needs neither 'unsafe-inline' beyond its own hash nor 'unsafe-eval'
 * in the Content-Security-Policy it ships with, and a device name carrying
 * markup is text wherever it appears.
 */

(function () {
  "use strict";

  /** Zoom bounds. Below the first the diagram is a smudge; above the second a pixel. */
  var MIN_SCALE = 0.1;
  var MAX_SCALE = 12;
  /** How far an arrow key pans, in screen pixels; Shift multiplies it. */
  var PAN_STEP = 60;
  var PAN_LEAP = 4;
  /** Matches listed before the rest are counted off. A list longer than this is
   *  not a result set, it is the inventory again. */
  var MAX_RESULTS = 60;

  var data = JSON.parse(document.getElementById("netgraph-data").textContent);

  var el = {
    stage: document.getElementById("ng-stage"),
    viewport: document.getElementById("ng-viewport"),
    layer: document.getElementById("ng-layer"),
    namespace: document.getElementById("ng-namespace"),
    ips: document.getElementById("ng-ips"),
    vlans: document.getElementById("ng-vlans"),
    search: document.getElementById("ng-search"),
    results: document.getElementById("ng-results"),
    matches: document.getElementById("ng-matches"),
    detail: document.getElementById("ng-detail"),
    counts: document.getElementById("ng-counts"),
    card: document.getElementById("ng-card"),
    keys: document.getElementById("ng-keys"),
    fit: document.getElementById("ng-fit"),
    reset: document.getElementById("ng-reset"),
    help: document.getElementById("ng-help")

  var state = {
    layer: 0,
    showIps: data.options.showIps,
    showVlans: data.options.showVlans,
    namespace: "",
    query: "",
    selected: null

  var view = { x: 0, y: 0, k: 1 };
  /** The id prefix every shape of the visible drawing carries; see html.py. */
  var prefix = "";
  /** Lazily built per layer: element id -> lower-cased searchable text. */
  var indexes = {};

  /* ----------------------------------------------------------------- data */

  function layer() {
    return data.layers[state.layer];
  }

  function records() {
    return layer().elements;
  }

  function recordOf(id) {
    return records()[id] || null;
  }

  function index() {
    if (!indexes[state.layer]) {
      var built = {};
      var elements = records();
      Object.keys(elements).forEach(function (id) {
        built[id] = netgraphDetail.haystack(elements[id]);
      });
      indexes[state.layer] = built;

    return indexes[state.layer];

  /** The namespace a record belongs to. An edge has none of its own, so it
   *  answers with its endpoints': a cable between two racks is in both. */

    return (record.endpoints || []).map(function (end) {

  function groupFor(id) {

  function idOf(group) {

      box.top >= stage.top && box.bottom <= stage.bottom

  function matches() {

    // hidden, wearing the classes it was last painted with. Clearing them here
    // rather than on the way out means there is one place where what a shape
    // looks like is decided.

      var record = recordOf(id);
      var item = document.createElement("li");
      var button = document.createElement("button");
      button.type = "button";
      button.appendChild(netgraphDetail.element("span", "name", netgraphDetail.label(record)));
      button.appendChild(document.createTextNode(" "));

  }

  function showCard(id, event) {

    if (!record) { hideCard(); return; }
    el.card.replaceChildren(
      netgraphDetail.describe(record, { showIps: state.showIps, showVlans: state.showVlans })

    el.card.hidden = false;

    var box = el.card.getBoundingClientRect();
    var x = event.clientX + margin;
    var y = event.clientY + margin;
    if (x + box.width > window.innerWidth - margin) { x = event.clientX - box.width - margin; }

  // still pans.
  el.stage.addEventListener("pointerdown", function (event) {
    if (event.pointerType === "mouse" && event.button !== 0) { return; }
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size === 1) {
      origin = { x: event.clientX - view.x, y: event.clientY - view.y, from: event.clientX };
      dragged = false;
      el.stage.classList.add("panning");
    } else if (pointers.size === 2) {
      origin = null;
      pinch = spread();
      hideCard();
    }
  });

  window.addEventListener("pointermove", function (event) {
    if (!pointers.has(event.pointerId)) { return; }
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size === 2 && pinch) {
      var now = spread();
      if (pinch.distance > 0 && now.distance > 0) {
        zoomAt(now.x, now.y, now.distance / pinch.distance);
      }
      pinch = now;
      return;
    }
    if (!origin) { return; }
    var next = { x: event.clientX - origin.x, y: event.clientY - origin.y };
    if (Math.abs(next.x - view.x) + Math.abs(next.y - view.y) > SLOP) { dragged = true; }
    view.x = next.x;
    view.y = next.y;
    hideCard();
    applyView();
  });

  function release(event) {
    pointers.delete(event.pointerId);
    if (pointers.size < 2) { pinch = null; }
    if (!pointers.size) {
      origin = null;
      el.stage.classList.remove("panning");
    }
  }

  window.addEventListener("pointerup", release);
  window.addEventListener("pointercancel", release);

  /** The distance between the two live pointers, and the point between them. */
  function spread() {
    var live = Array.from(pointers.values());
    var dx = live[0].x - live[1].x;
    var dy = live[0].y - live[1].y;
    return {
      distance: Math.sqrt(dx * dx + dy * dy),
      x: (live[0].x + live[1].x) / 2,
      y: (live[0].y + live[1].y) / 2
    };
  }

  /* ----------------------------------------------------------------- boot */

  showView();
  refresh();
  readHash();
})();
</script>
</body>
</html>
