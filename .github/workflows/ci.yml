name: CI

on:
  push:
    # Both halves of the ref space are named, and that is not redundant: a
    # ``push`` filter that mentions tags and not branches means "tags only".
    # Written with ``tags-ignore`` alone -- as it was between 2026-07-30 and this
    # commit -- this workflow stopped running on every push to every branch, and
    # said nothing while it did, because a workflow that is never triggered has
    # no run to be red. Three commits reached ``main`` ungated that way.
    branches:
      - "**"
    # ``pypi.yaml`` calls this workflow for a ``v*`` tag, so a tag push that
    # also triggered it here would run the whole matrix twice against the same
    # commit.
    tags-ignore:
      - "v*"
  pull_request:
  # Called by ``.github/workflows/pypi.yaml`` so that a release runs the *same*
  # gate a pull request does rather than a copy of a subset of it. Nothing about
  # the jobs below changes when it is called: the difference is only who asked.
  workflow_call:
  # So a run can be asked for by hand -- against a branch whose last push was
  # gated by something else, or to re-run the gate after a runner image changes
  # under a commit that has not moved.
  workflow_dispatch:

# Nothing here writes to the repository or the package registry.
permissions:
  contents: read

# A force-push to an open PR makes the in-flight run obsolete. Pushes to a
# branch are left alone so the history of a merge queue stays inspectable.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  # Every environment in this workflow is built by ``uv sync --locked`` from the
  # committed ``uv.lock``, so a job resolves nothing: it installs the exact
  # versions the lockfile names, on every runner and every interpreter. That is
  # what makes a red matrix entry a statement about *this* commit rather than
  # about whatever the index published in the last hour.
  #
  # ``--locked`` (rather than a plain ``uv sync``) is the half that matters: it
  # fails when pyproject.toml and uv.lock disagree instead of quietly relocking,
  # so a dependency edit that forgot to re-lock stops here. It is written out on
  # every sync below rather than set as UV_LOCKED here, so that each command is
  # correct read on its own -- and so tests/test_reproducibility.py can insist on
  # it. The ``lock`` job below says the same thing once and in seconds.
  #
  # A byte-compiled venv costs a few seconds once and saves them on every
  # ``netviz`` invocation in the steps that follow.
  UV_COMPILE_BYTECODE: "1"

jobs:
  # The cheapest job in the file and the one that keeps every other job honest:
  # if uv.lock has drifted from pyproject.toml, ``--locked`` below fails in the
  # slowest steps of six different jobs with the same message. This says it once,
  # first, and in seconds.
  lock:
    name: uv.lock is current
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: uv lock --check
        run: |
          set -euo pipefail
          if ! uv lock --check; then
            echo "::error::uv.lock is out of date with pyproject.toml; run 'uv lock' and commit the result"
            exit 1
          fi
          echo "uv.lock matches pyproject.toml"

      # A lockfile is only reproducibility if what it pins can still be fetched.
      # ``--frozen`` neither re-locks nor consults pyproject.toml, so this is a
      # download of the exact closure the matrix is about to install -- every
      # extra and every group, including the two nothing else in CI installs.
      #
      # This is the one job that deliberately asks setup-uv for no cache. A cache
      # would serve the wheels from the runner instead of the index, which is
      # precisely the fact this step is checking; a yanked or withdrawn
      # distribution would then keep passing here until the cache expired.
      - name: Every pinned distribution still resolves
        run: uv sync --frozen --all-extras --all-groups --no-install-project


  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python-version }}, yaml ${{ matrix.yaml-loader }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One version failing should not hide the result for the others.
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04"]
        python-version: ["3.10", "3.11", "3.12"]
        # ``auto`` picks libyaml whenever the PyYAML wheel carries it, which on
        # this runner it always does -- so these entries only ever exercise the
        # fast parser.
        yaml-loader: ["auto"]
        include:
          # PyYAML ships libyaml in most wheels but not all, so the pure-Python
          # parser is a path real users land on. Without this entry it would be
          # dead code in CI and the two loaders could drift apart unnoticed.
          - os: "ubuntu-24.04"
            python-version: "3.12"
            yaml-loader: "python"

          # The package claims 3.10-3.13 on PyPI and every job above runs on
          # Linux, so nothing proved the tool works on the platforms most of its
          # likely users are on. These two entries are that proof.
          #
          # One Python version each, and the middle of the supported range: the
          # things they are here to catch -- a path separator, a line ending, a
          # socket option, a filesystem-event backend -- are properties of the
          # operating system, not of the interpreter, so a second version would
          # double the cost and check the same thing twice. The interpreter range
          # is covered on Linux, where it is cheapest.
          #
          # ``coverage-floor`` is lower than the Linux gate on purpose and by a
          # measured amount: a handful of tests are skipped here for capabilities
          # the platform genuinely lacks (see tests/platform_marks.py), and the
          # lines they cover are counted as missed. Failing the job for that
          # would make the honest skip look like a regression.
          - os: "windows-latest"
            python-version: "3.12"
            yaml-loader: "auto"
            coverage-floor: 80
          - os: "macos-14"
            python-version: "3.12"
            yaml-loader: "auto"
            coverage-floor: 85

    env:
      NETVIZ_YAML_LOADER: ${{ matrix.yaml-loader }}

    defaults:
      run:
        # bash on all three runners, including Windows -- where it is Git Bash,
        # which the image ships. Without it every step below would have to be
        # written twice, once for POSIX ``sh`` and once for PowerShell, and the
        # two copies would drift. The PowerShell that netviz *generates* is
        # exercised by tests/test_platform.py, not by this shell choice.
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # ``graphviz`` (the PyPI package) is only a wrapper: it shells out to the
      # ``dot`` binary, which is not bundled. The svg/png/pdf tests fail without
      # the system package -- or rather they *skip*, which is worse, because the
      # job would then go green having drawn nothing.
      - name: Install Graphviz (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes graphviz
          dot -V

      # ``nft --check`` parses a ruleset without committing it, and is the only
      # gate on the generated ``etc/nftables.conf`` that is not netviz reading
      # its own writing. It still opens a netlink socket before it reads the
      # file, though, and that needs CAP_NET_ADMIN -- so on an unprivileged
      # runner every check failed with "cache initialization failed: Operation
      # not permitted", which is a verdict about this job and was reported as
      # though the ruleset were malformed.
      #
      # tests/platform_marks.py measures whether nft can parse here and skips if
      # it cannot, so the suite is honest either way. This step is what keeps the
      # gate *running* rather than skipping: it grants the binary the capability
      # and then re-runs the very probe the suite will run, so a grant that did
      # not take fails the job here rather than quietly turning the check off.
      #
      # The probe has to declare something. An empty file makes nft exit 0
      # without ever touching the cache, so it would pass in a process that
      # cannot check anything -- which is exactly the silence this step exists to
      # break. tests/fixtures/nft-probe.nft is therefore the one copy, read from
      # the checkout by both readers.
      #
      # It relies on the ``apt-get update`` above, which is Linux-only too and
      # runs immediately before it.
      - name: Let nft syntax-check a ruleset (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install --no-install-recommends --yes nftables libcap2-bin
          sudo setcap cap_net_admin+ep "$(command -v nft)"
          nft --check -f tests/fixtures/nft-probe.nft

      - name: Install Graphviz (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Already present on the image more often than not; ``|| true`` keeps a
          # "already installed" from failing the job, and ``dot -V`` below is the
          # check that actually matters.
          brew install graphviz || brew link --overwrite graphviz || true
          dot -V

      - name: Install Graphviz (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install graphviz --no-progress --yes

          # choco runs the official installer, which puts the binary under Program
          # Files but does not add it to PATH in the *current* process -- so the
          # directory is found and exported for the steps that follow.
          #
          # netviz does not depend on this: find_dot() searches exactly these
          # locations itself (netviz/render/dot.py), which is the behaviour the
          # "Confirm netviz finds Graphviz" step below checks. PATH is set for
          # everything else in the job -- `dot -V`, and the handful of tests that
          # shell out to `dot` directly rather than through netviz.
          $dot = Get-ChildItem -Path 'C:\Program Files', 'C:\Program Files (x86)' `
              -Filter 'dot.exe' -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*Graphviz*' } |
              Select-Object -First 1
          if (-not $dot) {
              Write-Output '::error::choco reported success but no Graphviz dot.exe was found'
              Get-ChildItem -Path 'C:\Program Files' -Filter '*Graphviz*' -ErrorAction SilentlyContinue
              exit 1
          }
          Write-Output "found $($dot.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value $dot.DirectoryName
          & $dot.FullName -V

      # uv rather than actions/setup-python, and the two are not interchangeable
      # here. uv is what reads uv.lock, and it also supplies the interpreter --
      # from the same ``python-version`` this matrix names -- so the Python and
      # the packages come from one tool with one pin instead of two that can
      # disagree. ``activate-environment`` puts the project venv on PATH for
      # every step below, which is why they still say ``pytest`` and ``netviz``
      # rather than ``uv run pytest``: the shape of this job did not change, only
      # where its bytes come from. The uv version itself is pinned by
      # ``[tool.uv] required-version`` in pyproject.toml, which setup-uv reads.
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install netviz and its dev extras, from uv.lock
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          uv pip list

      # The environment is only reproducible if it is the one the rest of the job
      # runs in. A stale interpreter on PATH -- the runner image ships several --
      # would let every step below pass against packages nobody pinned.
      - name: Confirm the locked environment is the one on PATH
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import sys

          # ``normcase`` rather than a plain comparison: on Windows the runner
          # spells the workspace ``D:\a\...`` and the interpreter may report
          # ``d:\a\...``, and a job failing over the case of a drive letter would
          # be a worse lie than the one this step exists to catch.
          def key(path: pathlib.Path) -> str:
              return os.path.normcase(str(path.resolve()))

          prefix = pathlib.Path(sys.prefix)
          expected = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / ".venv"
          print(f"sys.prefix={prefix} python={sys.version.split()[0]}")
          if key(prefix) != key(expected):
              raise SystemExit(f"::error::running from {prefix}, not the locked env at {expected}")
          wanted = "${{ matrix.python-version }}"
          got = f"{sys.version_info.major}.{sys.version_info.minor}"
          if got != wanted:
              raise SystemExit(f"::error::the locked env is Python {got}, the matrix asked for {wanted}")
          PY

      # ``dot -V`` above proved the *shell* can find Graphviz. This proves
      # netviz can, which on Windows is a different question: the installer
      # frequently leaves ``bin`` off PATH, so find_dot() also looks in the
      # documented install locations. Without this step a broken lookup would show
      # up as fifty skipped tests and a green job -- which is exactly the failure
      # this whole matrix entry exists to prevent.
      - name: Confirm netviz finds Graphviz on this platform
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          from netviz.render.dot import find_dot

          found = find_dot()
          print(f"os.name={os.name} find_dot()={found!r}")
          if found is None:
              raise SystemExit("::error::netviz cannot find Graphviz; the image tests would skip")
          print(subprocess.run([found, "-V"], capture_output=True, text=True).stderr.strip())
          PY

      # Without this the "python" entry is worth nothing: if the env var were
      # misspelt, or the selection logic silently fell back, the job would go
      # green having tested the fast parser a fourth time.
      - name: Confirm the intended YAML parser was selected
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from netviz.loader.documents import HAVE_LIBYAML, StrictSafeLoader

          mode = os.environ["NETVIZ_YAML_LOADER"]
          chosen = StrictSafeLoader.__name__
          expected = {
              "python": "PureStrictSafeLoader",
              "auto": "CStrictSafeLoader" if HAVE_LIBYAML else "PureStrictSafeLoader",
          }[mode]
          print(f"mode={mode} libyaml={HAVE_LIBYAML} loader={chosen}")
          if chosen != expected:
              raise SystemExit(f"::error::expected {expected}, got {chosen}")
          PY

      # Lint before the tests: a style failure is cheap to find and the test run
      # is the slowest step in the job.
      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        # ``--diff`` turns "file would be reformatted" into an actionable patch
        # in the log, so the fix does not require reproducing the run locally.
        run: ruff format --check --diff .

      - name: mypy
        # ``--python-version`` overrides the 3.10 floor pinned in pyproject.toml
        # so each matrix entry is type-checked against its own interpreter
        # semantics instead of checking the same thing three times.
        #
        # ``--platform`` is swept rather than left to the runner, because mypy
        # folds a literal ``sys.platform == "..."`` into a constant for whatever
        # platform it is running on -- so a type error inside a Windows-only
        # branch, or an unreachable line after a macOS-only one, is invisible
        # everywhere but there. Sweeping makes every branch checked in every job:
        # the Linux jobs then fail on it too, which is where it can be fixed
        # before the two slow runners have finished starting.
        run: |
          set -euo pipefail
          for platform in linux darwin win32; do
            echo "::group::mypy --platform ${platform}"
            mypy --platform "${platform}" \
                 --python-version ${{ matrix.python-version }} src/
            echo "::endgroup::"
          done

      - name: netviz fmt --check
        # What ruff is to this repository's Python, ``fmt`` is to the YAML it
        # ships: ``examples/`` is documentation, and documentation that does not
        # follow the format netviz documents is documentation arguing with
        # itself.
        #
        # ``--check`` lists what differs; the ``--diff`` afterwards turns that
        # list into an applicable patch in the log, so the fix does not require
        # reproducing the run locally. It runs only once the check has failed,
        # and its own exit status is discarded -- the verdict is already in.
        run: |
          set -euo pipefail
          if ! netviz fmt --check examples; then
            echo "::group::netviz fmt --diff examples"
            netviz fmt --diff examples || true
            echo "::endgroup::"
            echo "::error::examples/ is not in canonical form; run 'netviz fmt examples'"
            exit 1
          fi

      # Hypothesis writes the shrunk counterexample of every property failure to
      # this directory and replays it *first* on the next run. Caching it is
      # what makes that worth anything across jobs: a property that failed
      # yesterday re-runs that exact inventory today, before spending any budget
      # searching for it again. The key rotates per run so each job saves what
      # it learned; the restore keys fall back to whatever the most recent run
      # of the same matrix entry left behind.
      #
      # It is a cache and not an artefact on purpose: losing it costs search
      # time and nothing else, so a miss must never fail the job.
      - name: Restore the Hypothesis example database
        uses: actions/cache@v4
        with:
          path: .hypothesis
          # ``matrix.os`` is in the key because a counterexample found on Windows
          # is often a Windows counterexample: sharing the database across
          # platforms would let one runner's find be replayed as another's, which
          # is fine, but a *save* from a different platform overwriting the entry
          # is not what the restore keys below are for.
          key: hypothesis-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.yaml-loader }}-${{ github.run_id }}
          restore-keys: |
            hypothesis-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.yaml-loader }}-
            hypothesis-${{ matrix.os }}-${{ matrix.python-version }}-
            hypothesis-${{ matrix.os }}-

      - name: pytest
        id: pytest
        env:
          # 50 examples per property: enough to be worth running on a push,
          # small enough not to dominate a job that also lints and type-checks.
          # The nightly workflow runs the same properties at 1000; see
          # docs/testing.md.
          NETVIZ_HYPOTHESIS_PROFILE: ci
        # ``--cov=netviz`` and the coverage floor also live in pyproject.toml
        # (addopts / fail_under); they are repeated here so this command is
        # correct on its own and a local edit cannot silently lower the gate.
        #
        # The floor is 85 unless the matrix entry says otherwise; see the
        # ``coverage-floor`` note on the Windows entry for why it is lower there.
        #
        # ``-m 'not browser'`` because the ``browser`` job below owns that
        # module: it is not installable here (Playwright is in its own extra), so
        # every one of its tests would skip, and eleven skips that mean "another
        # job runs these" would drown the capability skips the step after this
        # one exists to surface.
        run: |
          pytest \
            -m 'not browser' \
            --cov \
            --cov-fail-under=${{ matrix.coverage-floor || 85 }} \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=junit.xml

      # A skip is a behaviour nothing checked, so the *number* of them is a
      # figure worth having in the log rather than buried in the pytest tail --
      # and on Windows and macOS it is the number this whole matrix entry is
      # about. Reported, not gated: the gate is
      # tests/test_platform.py::test_no_test_module_skips_a_whole_platform, which
      # fails if a skip is spelled as a platform rather than as a capability.
      - name: Summarise what was skipped on this platform
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("junit.xml").getroot()
          skipped = [
              (case.get("classname", ""), case.get("name", ""), skip.get("message", ""))
              for case in root.iter("testcase")
              for skip in case.findall("skipped")
          ]
          print(f"{len(skipped)} skipped")
          for classname, name, message in sorted(skipped):
              print(f"  {classname}::{name} -- {message}")
          PY

      # The performance guards have already run inside the step above, and they
      # have already failed the job if anything regressed. What they have *not*
      # done is put their figures anywhere anybody looks: every threshold in
      # tests/test_performance.py and tests/test_editor_performance.py has been
      # recalibrated at least once, and each time the only numbers to hand came
      # from the run that failed. So they are run once more with the capture off
      # and their ``[perf]`` lines put in the job summary, where a spread across
      # the whole matrix can be read off a green run rather than inferred from a
      # red one.
      #
      # Seven seconds, and deliberately not gating: a failure here is already a
      # failure above, and this step must never be the thing that turns a job
      # red on its own.
      - name: Report the performance figures
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        continue-on-error: true
        shell: bash
        run: |
          python -m pytest tests/test_performance.py tests/test_editor_performance.py \
            --no-cov -p no:randomly -q -s > perf.log 2>&1 || true
          {
            echo "### Performance guards"
            echo
            echo '```'
            grep '^\[perf\]' perf.log || echo "(no figures: the guards did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^\[perf\]' perf.log || true

      - name: Upload the coverage report
        # Runs whether pytest passed or failed -- the report of a failing run is
        # the interesting one -- but not when an earlier step never got there,
        # which would trip ``if-no-files-found: error`` with a misleading second
        # failure.
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          # ``matrix.os`` is in the name because artefact names must be unique
          # across the matrix: without it the Windows and macOS entries would
          # collide with the Linux 3.12 one and the upload would fail.
          name: coverage-report-${{ matrix.os }}-python-${{ matrix.python-version }}-yaml-${{ matrix.yaml-loader }}
          path: |
            coverage.xml
            htmlcov/
            junit.xml
          if-no-files-found: error
          retention-days: 14

  # ``netviz web`` is fourteen hundred lines of CSS and JavaScript that no
  # other job executes: the ``test`` matrix asserts the HTTP boundary and stops
  # there, so a regression in app.js would ship green. This job is the only place
  # a real browser opens the page.
  #
  # Its own job rather than a step in the matrix, for three reasons: it needs a
  # browser download the other jobs have no use for, it is Linux-only (what it
  # checks is our assets, not the platform), and its coverage must not touch the
  # Python gate -- hence ``--no-cov``. It runs the whole editor for real, so it
  # also needs Graphviz.
  browser:
    name: browser (chromium)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes graphviz
          dot -V

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Playwright above all: the driver version decides which browser build
      # ``playwright install`` fetches, so an unpinned driver is a browser that
      # changes under the accessibility gate overnight. uv.lock pins it, and the
      # step below downloads exactly the build this driver asks for.
      - name: Install netviz, its dev extras and Playwright, from uv.lock
        run: |
          set -euo pipefail
          uv sync --locked --extra dev --extra browser
          uv pip list

      # ``--with-deps`` installs the shared libraries the headless browser needs,
      # which the runner image does not carry in full. Chromium only: this layer
      # is here to catch a regression in our assets, not to survey engines.
      - name: Install the browser
        run: python -m playwright install --with-deps chromium

      # A skip here would be the whole job passing having opened nothing, which
      # is exactly the failure mode this job exists to prevent -- so the browser
      # being absent is checked before pytest gets a chance to be lenient about it.
      - name: Confirm the browser starts
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              print(f"chromium {browser.version}")
              browser.close()
          PY

      - name: pytest -m browser
        id: pytest
        env:
          # Where a failing test leaves its screenshot, page source and console
          # log; the upload below is what makes them worth writing.
          NETVIZ_BROWSER_ARTIFACTS: ${{ github.workspace }}/browser-artifacts
        # ``--no-cov`` on purpose: this job must not contribute to -- or be
        # measured against -- the coverage gate the ``test`` matrix enforces.
        # ``-m browser`` selects the module; ``-p no:randomly`` is not needed
        # because nothing here shares state between tests.
        run: |
          pytest -m browser --no-cov -ra --junitxml=browser-junit.xml

      # A module that skipped itself would be a green job that opened no browser.
      - name: Fail if nothing was actually driven
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET

          suite = ET.parse("browser-junit.xml").getroot()
          cases = list(suite.iter("testcase"))
          skipped = [case for case in cases if case.findall("skipped")]
          print(f"{len(cases)} browser tests, {len(skipped)} skipped")
          for case in skipped:
              print(f"  {case.get('name')} -- {case.findall('skipped')[0].get('message', '')}")
          # The two direct-manipulation tests skip until the canvas grows the
          # gestures they perform; anything beyond that means the browser was
          # never there and the job proved nothing.
          if len(cases) - len(skipped) < 5:
              raise SystemExit("::error::the browser suite ran almost nothing; was chromium missing?")
          # The accessibility gate is only a gate while it runs. axe-core is in
          # the ``browser`` extra this job installs, so a skip here is a broken
          # install rather than a contributor without it -- and a silently
          # skipped gate is the failure mode a gate exists to prevent.
          absent = [case for case in skipped if "axe-core is not installed" in
                    (case.findall("skipped")[0].get("message") or "")]
          if absent:
              raise SystemExit("::error::the accessibility gate did not run; axe-core is missing")
          PY

      - name: Upload the failure evidence
        if: ${{ failure() && steps.pytest.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            browser-artifacts/
            browser-junit.xml
          if-no-files-found: warn
          retention-days: 14

  # The example inventories are the only trees this repository ships that a user
  # would recognise, so they are also what the CI integrations are exercised
  # against: if the composite action, the SARIF upload or the annotation format
  # breaks, it breaks here rather than in somebody else's pipeline.
  discover-examples:
    name: discover examples
    runs-on: ubuntu-24.04
    outputs:
      inventories: ${{ steps.list.outputs.inventories }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: List the example inventories
        id: list
        run: |
          set -euo pipefail
          shopt -s nullglob
          names=()
          for inventory in examples/*/; do
            names+=("$(basename "$inventory")")
          done

          # A glob that quietly matched nothing would produce an empty matrix,
          # and an empty matrix is a job that succeeds having checked nothing.
          if [ "${#names[@]}" -lt 2 ]; then
            echo "::error::expected at least 2 example inventories under examples/, found ${#names[@]}"
            exit 1
          fi

          printf 'inventories=%s\n' \
            "$(printf '%s\n' "${names[@]}" | jq --raw-input --slurp --compact-output 'split("\n") | map(select(. != ""))')" \
            >>"$GITHUB_OUTPUT"

  validate-examples:
    name: validate ${{ matrix.inventory }}
    runs-on: ubuntu-24.04
    needs: discover-examples

    permissions:
      contents: read
      # Only the upload-sarif step needs this, and only on this repository's own
      # branches -- the token a fork's pull request gets is read-only.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        inventory: ${{ fromJSON(needs.discover-examples.outputs.inventories) }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The composite action installs netviz itself, into whatever environment it
      # finds -- that is its contract in somebody else's repository, and this job
      # exercises it as written. What it needs from here is an interpreter and a
      # uv on PATH for it to prefer; ``activate-environment`` gives it a venv to
      # install into rather than the system Python, which on this runner is
      # externally managed.
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Uses the action from this very checkout, so a change to it is tested by
      # the pull request that makes it rather than after the merge.
      - name: Validate, as SARIF
        id: sarif
        uses: ./.github/actions/netviz-validate
        with:
          inventory: examples/${{ matrix.inventory }}
          strict: "true"
          output-format: sarif
          # Report first, fail afterwards: a run that stopped here would never
          # upload the findings that explain why it stopped.
          fail-on-error: "false"

      - name: Upload the SARIF report
        # A fork's pull request cannot write security events; skipping is the
        # documented behaviour, and the next step still fails the job.
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.sarif.outputs.report }}
          category: netviz-${{ matrix.inventory }}

      - name: Check the SARIF document
        env:
          REPORT: ${{ steps.sarif.outputs.report }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          report = json.load(open(os.environ["REPORT"], encoding="utf-8"))
          run = report["runs"][0]
          rules = run["tool"]["driver"]["rules"]
          print(f"{len(rules)} rules described, {len(run['results'])} results")

          from netviz.rules import RULES

          missing = {rule.id for rule in RULES} - {entry["id"] for entry in rules}
          if missing:
              raise SystemExit(f"::error::rules missing from the SARIF driver: {sorted(missing)}")
          if report["version"] != "2.1.0":
              raise SystemExit(f"::error::expected SARIF 2.1.0, got {report['version']}")
          PY

      # The annotation format is what a pull request actually sees, so it is run
      # for real rather than inspected: anything it reports lands on the diff.
      - name: Validate, as annotations
        uses: ./.github/actions/netviz-validate
        with:
          inventory: examples/${{ matrix.inventory }}
          strict: "true"
          output-format: github
          install: "false"

      - name: Check the JSON envelope
        run: |
          set -euo pipefail
          netviz --quiet --inventory "examples/${{ matrix.inventory }}" \
            validate --strict --output-format json >report.json
          python - <<'PY'
          import json

          report = json.load(open("report.json", encoding="utf-8"))
          summary = report["summary"]
          print(json.dumps(summary))
          if report["schemaVersion"] != 1:
              raise SystemExit(f"::error::unexpected envelope version {report['schemaVersion']}")
          if summary["total"] != len(report["findings"]):
              raise SystemExit("::error::summary.total disagrees with the findings array")
          PY

      # The examples are the documentation; one of them failing --strict means
      # the README shows an inventory netviz itself would reject.
      - name: Fail if the example did not validate
        if: steps.sarif.outputs.failed == 'true'
        run: |
          echo "::error::examples/${{ matrix.inventory }} does not validate under --strict"
          exit 1

  render-examples:
    name: render examples
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes graphviz
          dot -V

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The examples are rendered by the shipped console script, so this job
      # deliberately installs no extras and no groups -- it checks that a plain
      # install of netviz can draw the documented inventories. ``--no-dev`` is
      # the uv spelling of that: the default group is excluded too, so what ends
      # up here is exactly the ``dependencies`` list and its closure.
      - name: Install netviz, from uv.lock
        run: |
          set -euo pipefail
          uv sync --locked --no-dev
          uv pip list

      - name: Render every example inventory to SVG
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          inventories=(examples/*/)

          # Guard against a glob that quietly matches nothing: an empty loop
          # would exit 0 and report "all examples render" having rendered none.
          if [ "${#inventories[@]}" -lt 2 ]; then
            echo "::error::expected at least 2 example inventories under examples/, found ${#inventories[@]}"
            exit 1
          fi

          status=0
          for inventory in "${inventories[@]}"; do
            name="$(basename "$inventory")"
            svg="out/${name}.svg"
            echo "::group::render ${name}"

            rc=0
            netviz --inventory "$inventory" render --format svg --output "$svg" || rc=$?

            if [ "$rc" -ne 0 ]; then
              echo "::error::${name}: netviz render exited ${rc}"
              status=1
            elif [ ! -s "$svg" ]; then
              echo "::error::${name}: render succeeded but ${svg} is empty"
              status=1
            elif ! grep -q '<svg' "$svg"; then
              # Exit code 0 plus bytes on disk still is not proof of an SVG.
              echo "::error::${name}: ${svg} does not contain an <svg> element"
              status=1
            else
              echo "ok: ${svg} ($(wc -c <"$svg") bytes)"
            fi

            echo "::endgroup::"
          done

          exit "$status"

      # The composite action shipped for other people's repositories, run from
      # this very checkout: a change to it is tested by the pull request that
      # makes it rather than by whoever pulls it next. ``netviz-pages.yml``
      # is this step and an upload, so exercising it here is what keeps the
      # published-diagram path honest without deploying a second site over the
      # one ``pages.yml`` maintains.
      - name: Render a page through the action
        id: page
        uses: ./.github/actions/netviz-render
        with:
          inventory: examples/campus
          layer: l1,l2,l3
          title: campus (netviz CI)
          output: out/campus.html
          strict: "true"
          # Both are already on this runner; the action's own installers are
          # exercised by consumers, not by re-running them here.
          install: "false"
          graphviz: "false"

      # ``format`` is not decoration: the mermaid path never touches Graphviz,
      # so it also proves ``graphviz: auto`` skips the install rather than
      # failing to find a package manager it did not need.
      - name: Render a Mermaid diagram through the action
        id: mermaid
        uses: ./.github/actions/netviz-render
        with:
          inventory: examples/campus
          format: mermaid
          output: out/campus.mmd
          install: "false"

      - name: Check what the action produced
        env:
          PAGE: ${{ steps.page.outputs.file }}
          PAGE_BYTES: ${{ steps.page.outputs.bytes }}
          PAGE_DIR: ${{ steps.page.outputs.directory }}
          MERMAID: ${{ steps.mermaid.outputs.file }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import sys

          page = pathlib.Path(os.environ["PAGE"])
          if page != pathlib.Path("out/campus.html"):
              sys.exit(f"::error::the action reported {page}, not the output it was given")
          if pathlib.Path(os.environ["PAGE_DIR"]) != page.parent:
              sys.exit("::error::the 'directory' output is not the directory of 'file'")

          text = page.read_text(encoding="utf-8")
          if int(os.environ["PAGE_BYTES"]) != len(page.read_bytes()):
              sys.exit("::error::the 'bytes' output is not the size of the page")
          # One page, three layers, one switcher over them: the thing that
          # makes an HTML render publishable as-is rather than as three files.
          import re

          drawn = re.findall(r'<option value="\d+">(l\d)[^<]*</option>', text)
          if drawn != ["l1", "l2", "l3"]:
              sys.exit(f"::error::the page offers the layers {drawn}, not the three asked for")
          # The default is the inventory's own name, so a title that reached the
          # page is a title that says something the default does not.
          if "<h1>campus (netviz CI)</h1>" not in text:
              sys.exit("::error::the page does not carry the title it was given")

          mermaid = pathlib.Path(os.environ["MERMAID"])
          if not mermaid.read_text(encoding="utf-8").startswith("flowchart"):
              sys.exit(f"::error::{mermaid} is not a Mermaid flowchart")
          print(f"{page} ({len(text)} bytes), {mermaid} ok")
          PY

      - name: Upload the rendered diagrams
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: example-diagrams
          path: out/
          if-no-files-found: warn
          retention-days: 14

  # ``docker-compose.yml`` and ``Dockerfile`` are asserted against the CLI by
  # tests/test_docker.py -- that every service names a real command with real
  # flags, that the published ports are the ones the servers bind, that every
  # variable has a default. What that cannot do is prove the thing runs: a
  # compose file that parses is not a compose file that works, and the image is
  # built by Docker rather than by pytest. So this job builds it and drives all
  # three services for real.
  docker:
    name: docker compose
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Show what Docker is available
        run: |
          set -euo pipefail
          docker version
          docker compose version

      # Catches an interpolation with no default, an unknown key or a broken
      # anchor before spending a build on it.
      - name: Check the compose file resolves
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose config --services | sort

      - name: Build the image
        run: |
          set -euo pipefail
          docker compose build
          docker image ls netviz:local

      # The inventory the services read is a copy, not the checkout: the CLI
      # service mounts it read-write and this job writes a render into it, which
      # must not be able to dirty the tree the rest of CI is looking at.
      - name: Copy an example inventory out of the checkout
        run: |
          set -euo pipefail
          cp -r examples/home-lab "${RUNNER_TEMP}/inventory"
          ls -la "${RUNNER_TEMP}/inventory"

      - name: Run the CLI through the container
        env:
          NETVIZ_INVENTORY: ${{ runner.temp }}/inventory
        run: |
          set -euo pipefail
          # Files the container writes have to land owned by whoever asked for
          # them; the render below is checked for exactly that.
          NETVIZ_UID="$(id -u)" NETVIZ_GID="$(id -g)" \
            docker compose run --rm netviz validate --strict
          docker compose run --rm netviz list devices
          NETVIZ_UID="$(id -u)" NETVIZ_GID="$(id -g)" \
            docker compose run --rm netviz render --layer l2 -f svg -o topology.svg

          svg="${NETVIZ_INVENTORY}/topology.svg"
          if [ ! -s "$svg" ]; then
            echo "::error::the container reported a render but ${svg} is empty or absent"
            exit 1
          fi
          if ! grep -q '<svg' "$svg"; then
            echo "::error::${svg} does not contain an <svg> element"
            exit 1
          fi
          # A file owned by root here is the daily annoyance the ``user:`` key in
          # the compose file exists to prevent, so it is a failure and not a note.
          owner="$(stat -c '%u:%g' "$svg")"
          if [ "$owner" != "$(id -u):$(id -g)" ]; then
            echo "::error::${svg} is owned by ${owner}, not by $(id -u):$(id -g)"
            exit 1
          fi
          echo "ok: $(wc -c <"$svg") bytes, owned by ${owner}"

      - name: Start the two servers
        env:
          NETVIZ_INVENTORY: ${{ runner.temp }}/inventory
        run: |
          set -euo pipefail
          docker compose up --detach web watch
          docker compose ps

      # The health checks are declared in the compose file; waiting for them is
      # also what proves they are correct, since a check that polls a route the
      # server does not answer never reports healthy.
      - name: Wait for both health checks
        run: |
          set -euo pipefail
          for service in web watch; do
            container="netviz-${service}-1"
            for attempt in $(seq 1 30); do
              state="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
              if [ "$state" = "healthy" ]; then
                echo "${service}: healthy after ${attempt} attempt(s)"
                break
              fi
              if [ "$state" = "unhealthy" ] || [ "$attempt" -eq 30 ]; then
                echo "::error::${service} is ${state}"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Fetch a page from each server
        run: |
          set -euo pipefail
          # The editor's own page, which carries the document stream.
          curl --fail --silent --show-error http://127.0.0.1:8081/ >web.html
          grep -q "netviz" web.html

          # The preview's status document. ``ok`` means the mounted tree loaded,
          # validated and rendered inside the container.
          curl --fail --silent --show-error http://127.0.0.1:8080/status.json >status.json
          cat status.json
          python -c '
          import json
          status = json.load(open("status.json", encoding="utf-8"))
          if status["status"] != "ok":
              raise SystemExit(f"::error::the preview reports {status!r}")
          if not status["hasPayload"]:
              raise SystemExit("::error::the preview served no diagram")
          '

          # And the diagram itself, which is what a browser would ask for next.
          curl --fail --silent --show-error http://127.0.0.1:8080/render.svg >render.svg
          grep -q "<svg" render.svg

      # The point of the whole service: a file changes on the host and the
      # container notices. This is the step that would fail if a bind mount
      # stopped delivering filesystem events on the runner.
      - name: Change a file and watch it re-render
        env:
          NETVIZ_INVENTORY: ${{ runner.temp }}/inventory
        run: |
          set -euo pipefail
          before="$(curl --fail --silent http://127.0.0.1:8080/status.json |
            python -c 'import json,sys; print(json.load(sys.stdin)["revision"])')"

          printf '\n# touched by CI to trigger a re-render\n' \
            >>"${NETVIZ_INVENTORY}/switches/sw-home.yaml"

          for attempt in $(seq 1 20); do
            after="$(curl --fail --silent http://127.0.0.1:8080/status.json |
              python -c 'import json,sys; print(json.load(sys.stdin)["revision"])')"
            if [ "$after" -gt "$before" ]; then
              echo "re-rendered: revision ${before} -> ${after}"
              exit 0
            fi
            sleep 1
          done

          echo "::error::the watcher never re-rendered (revision stayed at ${before})"
          docker compose logs watch
          exit 1

      - name: Show the container logs
        if: ${{ !cancelled() }}
        run: docker compose logs --timestamps

      # ``down`` rather than leaving it to the runner, because the time it takes
      # is itself a check: netviz is PID 1 in there, and without ``init: true``
      # a SIGTERM it ignores would cost the full ten-second grace period.
      - name: Stop everything
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          docker compose down --remove-orphans --timeout 10
          elapsed=$(( $(date +%s) - start ))
          echo "stopped in ${elapsed}s"
          if [ "$elapsed" -ge 10 ]; then
            echo "::error::the containers had to be killed; is 'init: true' still set?"
            exit 1
          fi
