name: CI

on:
  push:
  pull_request:

# Nothing here writes to the repository or the package registry.
permissions:
  contents: read

# A force-push to an open PR makes the in-flight run obsolete. Pushes to a
# branch are left alone so the history of a merge queue stays inspectable.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep pip quiet and deterministic: no version nag, no interactive prompts,
  # and no attempt to reach a keyring for the public index.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  test:
    name: test (python ${{ matrix.python-version }}, yaml ${{ matrix.yaml-loader }})
    runs-on: ubuntu-24.04
    strategy:
      # One version failing should not hide the result for the others.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # ``auto`` picks libyaml whenever the PyYAML wheel carries it, which on
        # this runner it always does -- so these three entries only ever
        # exercise the fast parser.
        yaml-loader: ["auto"]
        include:
          # PyYAML ships libyaml in most wheels but not all, so the pure-Python
          # parser is a path real users land on. Without this entry it would be
          # dead code in CI and the two loaders could drift apart unnoticed.
          - python-version: "3.12"
            yaml-loader: "python"

    env:
      NETGRAPH_YAML_LOADER: ${{ matrix.yaml-loader }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # ``graphviz`` (the PyPI package) is only a wrapper: it shells out to the
      # ``dot`` binary, which is not bundled. The svg/png/pdf tests fail without
      # the system package.
      - name: Install Graphviz
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes graphviz
          dot -V

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install netgraph and its dev extras
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"
          python -m pip list

      # Without this the "python" entry is worth nothing: if the env var were
      # misspelt, or the selection logic silently fell back, the job would go
      # green having tested the fast parser a fourth time.
      - name: Confirm the intended YAML parser was selected
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from netgraph.loader.documents import HAVE_LIBYAML, StrictSafeLoader

          mode = os.environ["NETGRAPH_YAML_LOADER"]
          chosen = StrictSafeLoader.__name__
          expected = {
              "python": "PureStrictSafeLoader",
              "auto": "CStrictSafeLoader" if HAVE_LIBYAML else "PureStrictSafeLoader",
          }[mode]
          print(f"mode={mode} libyaml={HAVE_LIBYAML} loader={chosen}")
          if chosen != expected:
              raise SystemExit(f"::error::expected {expected}, got {chosen}")
          PY

      # Lint before the tests: a style failure is cheap to find and the test run
      # is the slowest step in the job.
      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        # ``--diff`` turns "file would be reformatted" into an actionable patch
        # in the log, so the fix does not require reproducing the run locally.
        run: ruff format --check --diff .

      - name: mypy
        # ``--python-version`` overrides the 3.10 floor pinned in pyproject.toml
        # so each matrix entry is type-checked against its own interpreter
        # semantics instead of checking the same thing three times.
        run: mypy --python-version ${{ matrix.python-version }} src/

      - name: netgraph fmt --check
        # What ruff is to this repository's Python, ``fmt`` is to the YAML it
        # ships: ``examples/`` is documentation, and documentation that does not
        # follow the format netgraph documents is documentation arguing with
        # itself.
        #
        # ``--check`` lists what differs; the ``--diff`` afterwards turns that
        # list into an applicable patch in the log, so the fix does not require
        # reproducing the run locally. It runs only once the check has failed,
        # and its own exit status is discarded -- the verdict is already in.
        run: |
          set -euo pipefail
          if ! netgraph fmt --check examples; then
            echo "::group::netgraph fmt --diff examples"
            netgraph fmt --diff examples || true
            echo "::endgroup::"
            echo "::error::examples/ is not in canonical form; run 'netgraph fmt examples'"
            exit 1
          fi

      # Hypothesis writes the shrunk counterexample of every property failure to
      # this directory and replays it *first* on the next run. Caching it is
      # what makes that worth anything across jobs: a property that failed
      # yesterday re-runs that exact inventory today, before spending any budget
      # searching for it again. The key rotates per run so each job saves what
      # it learned; the restore keys fall back to whatever the most recent run
      # of the same matrix entry left behind.
      #
      # It is a cache and not an artefact on purpose: losing it costs search
      # time and nothing else, so a miss must never fail the job.
      - name: Restore the Hypothesis example database
        uses: actions/cache@v4
        with:
          path: .hypothesis
          key: hypothesis-${{ matrix.python-version }}-${{ matrix.yaml-loader }}-${{ github.run_id }}
          restore-keys: |
            hypothesis-${{ matrix.python-version }}-${{ matrix.yaml-loader }}-
            hypothesis-${{ matrix.python-version }}-

      - name: pytest
        id: pytest
        env:
          # 50 examples per property: enough to be worth running on a push,
          # small enough not to dominate a job that also lints and type-checks.
          # The nightly workflow runs the same properties at 1000; see
          # docs/testing.md.
          NETGRAPH_HYPOTHESIS_PROFILE: ci
        # ``--cov=netgraph`` and the coverage floor also live in pyproject.toml
        # (addopts / fail_under); they are repeated here so this command is
        # correct on its own and a local edit cannot silently lower the gate.
        run: |
          pytest \
            --cov \
            --cov-fail-under=85 \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=junit.xml

      - name: Upload the coverage report
        # Runs whether pytest passed or failed -- the report of a failing run is
        # the interesting one -- but not when an earlier step never got there,
        # which would trip ``if-no-files-found: error`` with a misleading second
        # failure.
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-python-${{ matrix.python-version }}-yaml-${{ matrix.yaml-loader }}
          path: |
            coverage.xml
            htmlcov/
            junit.xml
          if-no-files-found: error
          retention-days: 14

  # The example inventories are the only trees this repository ships that a user
  # would recognise, so they are also what the CI integrations are exercised
  # against: if the composite action, the SARIF upload or the annotation format
  # breaks, it breaks here rather than in somebody else's pipeline.
  discover-examples:
    name: discover examples
    runs-on: ubuntu-24.04
    outputs:
      inventories: ${{ steps.list.outputs.inventories }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: List the example inventories
        id: list
        run: |
          set -euo pipefail
          shopt -s nullglob
          names=()
          for inventory in examples/*/; do
            names+=("$(basename "$inventory")")
          done

          # A glob that quietly matched nothing would produce an empty matrix,
          # and an empty matrix is a job that succeeds having checked nothing.
          if [ "${#names[@]}" -lt 2 ]; then
            echo "::error::expected at least 2 example inventories under examples/, found ${#names[@]}"
            exit 1
          fi

          printf 'inventories=%s\n' \
            "$(printf '%s\n' "${names[@]}" | jq --raw-input --slurp --compact-output 'split("\n") | map(select(. != ""))')" \
            >>"$GITHUB_OUTPUT"

  validate-examples:
    name: validate ${{ matrix.inventory }}
    runs-on: ubuntu-24.04
    needs: discover-examples

    permissions:
      contents: read
      # Only the upload-sarif step needs this, and only on this repository's own
      # branches -- the token a fork's pull request gets is read-only.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        inventory: ${{ fromJSON(needs.discover-examples.outputs.inventories) }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Uses the action from this very checkout, so a change to it is tested by
      # the pull request that makes it rather than after the merge.
      - name: Validate, as SARIF
        id: sarif
        uses: ./.github/actions/netgraph-validate
        with:
          inventory: examples/${{ matrix.inventory }}
          strict: "true"
          output-format: sarif
          # Report first, fail afterwards: a run that stopped here would never
          # upload the findings that explain why it stopped.
          fail-on-error: "false"

      - name: Upload the SARIF report
        # A fork's pull request cannot write security events; skipping is the
        # documented behaviour, and the next step still fails the job.
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.sarif.outputs.report }}
          category: netgraph-${{ matrix.inventory }}

      - name: Check the SARIF document
        env:
          REPORT: ${{ steps.sarif.outputs.report }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          report = json.load(open(os.environ["REPORT"], encoding="utf-8"))
          run = report["runs"][0]
          rules = run["tool"]["driver"]["rules"]
          print(f"{len(rules)} rules described, {len(run['results'])} results")

          from netgraph.rules import RULES

          missing = {rule.id for rule in RULES} - {entry["id"] for entry in rules}
          if missing:
              raise SystemExit(f"::error::rules missing from the SARIF driver: {sorted(missing)}")
          if report["version"] != "2.1.0":
              raise SystemExit(f"::error::expected SARIF 2.1.0, got {report['version']}")
          PY

      # The annotation format is what a pull request actually sees, so it is run
      # for real rather than inspected: anything it reports lands on the diff.
      - name: Validate, as annotations
        uses: ./.github/actions/netgraph-validate
        with:
          inventory: examples/${{ matrix.inventory }}
          strict: "true"
          output-format: github
          install: "false"

      - name: Check the JSON envelope
        run: |
          set -euo pipefail
          netgraph --quiet --inventory "examples/${{ matrix.inventory }}" \
            validate --strict --output-format json >report.json
          python - <<'PY'
          import json

          report = json.load(open("report.json", encoding="utf-8"))
          summary = report["summary"]
          print(json.dumps(summary))
          if report["schemaVersion"] != 1:
              raise SystemExit(f"::error::unexpected envelope version {report['schemaVersion']}")
          if summary["total"] != len(report["findings"]):
              raise SystemExit("::error::summary.total disagrees with the findings array")
          PY

      # The examples are the documentation; one of them failing --strict means
      # the README shows an inventory netgraph itself would reject.
      - name: Fail if the example did not validate
        if: steps.sarif.outputs.failed == 'true'
        run: |
          echo "::error::examples/${{ matrix.inventory }} does not validate under --strict"
          exit 1

  render-examples:
    name: render examples
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes graphviz
          dot -V

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The examples are rendered by the shipped console script, so this job
          # deliberately installs no dev extras -- it checks that a plain
          # ``pip install netgraph`` can draw the documented inventories.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install netgraph
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --editable .

      - name: Render every example inventory to SVG
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          inventories=(examples/*/)

          # Guard against a glob that quietly matches nothing: an empty loop
          # would exit 0 and report "all examples render" having rendered none.
          if [ "${#inventories[@]}" -lt 2 ]; then
            echo "::error::expected at least 2 example inventories under examples/, found ${#inventories[@]}"
            exit 1
          fi

          status=0
          for inventory in "${inventories[@]}"; do
            name="$(basename "$inventory")"
            svg="out/${name}.svg"
            echo "::group::render ${name}"

            rc=0
            netgraph --inventory "$inventory" render --format svg --output "$svg" || rc=$?

            if [ "$rc" -ne 0 ]; then
              echo "::error::${name}: netgraph render exited ${rc}"
              status=1
            elif [ ! -s "$svg" ]; then
              echo "::error::${name}: render succeeded but ${svg} is empty"
              status=1
            elif ! grep -q '<svg' "$svg"; then
              # Exit code 0 plus bytes on disk still is not proof of an SVG.
              echo "::error::${name}: ${svg} does not contain an <svg> element"
              status=1
            else
              echo "ok: ${svg} ($(wc -c <"$svg") bytes)"
            fi

            echo "::endgroup::"
          done

          exit "$status"

      - name: Upload the rendered diagrams
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: example-diagrams
          path: out/
          if-no-files-found: warn
          retention-days: 14

  # ``docker-compose.yml`` and ``Dockerfile`` are asserted against the CLI by
  # tests/test_docker.py -- that every service names a real command with real
  # flags, that the published ports are the ones the servers bind, that every
  # variable has a default. What that cannot do is prove the thing runs: a
  # compose file that parses is not a compose file that works, and the image is
  # built by Docker rather than by pytest. So this job builds it and drives all
  # three services for real.
  docker:
    name: docker compose
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Show what Docker is available
        run: |
          set -euo pipefail
          docker version
          docker compose version

      # Catches an interpolation with no default, an unknown key or a broken
      # anchor before spending a build on it.
      - name: Check the compose file resolves
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose config --services | sort

      - name: Build the image
        run: |
          set -euo pipefail
          docker compose build
          docker image ls netgraph:local

      # The inventory the services read is a copy, not the checkout: the CLI
      # service mounts it read-write and this job writes a render into it, which
      # must not be able to dirty the tree the rest of CI is looking at.
      - name: Copy an example inventory out of the checkout
        run: |
          set -euo pipefail
          cp -r examples/home-lab "${RUNNER_TEMP}/inventory"
          ls -la "${RUNNER_TEMP}/inventory"

      - name: Run the CLI through the container
        env:
          NETGRAPH_INVENTORY: ${{ runner.temp }}/inventory
        run: |
          set -euo pipefail
          # Files the container writes have to land owned by whoever asked for
          # them; the render below is checked for exactly that.
          NETGRAPH_UID="$(id -u)" NETGRAPH_GID="$(id -g)" \
            docker compose run --rm netgraph validate --strict
          docker compose run --rm netgraph list devices
          NETGRAPH_UID="$(id -u)" NETGRAPH_GID="$(id -g)" \
            docker compose run --rm netgraph render --layer l2 -f svg -o topology.svg

          svg="${NETGRAPH_INVENTORY}/topology.svg"
          if [ ! -s "$svg" ]; then
            echo "::error::the container reported a render but ${svg} is empty or absent"
            exit 1
          fi
          if ! grep -q '<svg' "$svg"; then
            echo "::error::${svg} does not contain an <svg> element"
            exit 1
          fi
          # A file owned by root here is the daily annoyance the ``user:`` key in
          # the compose file exists to prevent, so it is a failure and not a note.
          owner="$(stat -c '%u:%g' "$svg")"
          if [ "$owner" != "$(id -u):$(id -g)" ]; then
            echo "::error::${svg} is owned by ${owner}, not by $(id -u):$(id -g)"
            exit 1
          fi
          echo "ok: $(wc -c <"$svg") bytes, owned by ${owner}"

      - name: Start the two servers
        env:
          NETGRAPH_INVENTORY: ${{ runner.temp }}/inventory
        run: |
          set -euo pipefail
          docker compose up --detach web watch
          docker compose ps

      # The health checks are declared in the compose file; waiting for them is
      # also what proves they are correct, since a check that polls a route the
      # server does not answer never reports healthy.
      - name: Wait for both health checks
        run: |
          set -euo pipefail
          for service in web watch; do
            container="netgraph-${service}-1"
            for attempt in $(seq 1 30); do
              state="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
              if [ "$state" = "healthy" ]; then
                echo "${service}: healthy after ${attempt} attempt(s)"
                break
              fi
              if [ "$state" = "unhealthy" ] || [ "$attempt" -eq 30 ]; then
                echo "::error::${service} is ${state}"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Fetch a page from each server
        run: |
          set -euo pipefail
          # The editor's own page, which carries the document stream.
          curl --fail --silent --show-error http://127.0.0.1:8081/ >web.html
          grep -q "netgraph" web.html

          # The preview's status document. ``ok`` means the mounted tree loaded,
          # validated and rendered inside the container.
          curl --fail --silent --show-error http://127.0.0.1:8080/status.json >status.json
          cat status.json
          python -c '
          import json
          status = json.load(open("status.json", encoding="utf-8"))
          if status["status"] != "ok":
              raise SystemExit(f"::error::the preview reports {status!r}")
          if not status["hasPayload"]:
              raise SystemExit("::error::the preview served no diagram")
          '

          # And the diagram itself, which is what a browser would ask for next.
          curl --fail --silent --show-error http://127.0.0.1:8080/render.svg >render.svg
          grep -q "<svg" render.svg

      # The point of the whole service: a file changes on the host and the
      # container notices. This is the step that would fail if a bind mount
      # stopped delivering filesystem events on the runner.
      - name: Change a file and watch it re-render
        env:
          NETGRAPH_INVENTORY: ${{ runner.temp }}/inventory
        run: |
          set -euo pipefail
          before="$(curl --fail --silent http://127.0.0.1:8080/status.json |
            python -c 'import json,sys; print(json.load(sys.stdin)["revision"])')"

          printf '\n# touched by CI to trigger a re-render\n' \
            >>"${NETGRAPH_INVENTORY}/switches/sw-home.yaml"

          for attempt in $(seq 1 20); do
            after="$(curl --fail --silent http://127.0.0.1:8080/status.json |
              python -c 'import json,sys; print(json.load(sys.stdin)["revision"])')"
            if [ "$after" -gt "$before" ]; then
              echo "re-rendered: revision ${before} -> ${after}"
              exit 0
            fi
            sleep 1
          done

          echo "::error::the watcher never re-rendered (revision stayed at ${before})"
          docker compose logs watch
          exit 1

      - name: Show the container logs
        if: ${{ !cancelled() }}
        run: docker compose logs --timestamps

      # ``down`` rather than leaving it to the runner, because the time it takes
      # is itself a check: netgraph is PID 1 in there, and without ``init: true``
      # a SIGTERM it ignores would cost the full ten-second grace period.
      - name: Stop everything
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          docker compose down --remove-orphans --timeout 10
          elapsed=$(( $(date +%s) - start ))
          echo "stopped in ${elapsed}s"
          if [ "$elapsed" -ge 10 ]; then
            echo "::error::the containers had to be killed; is 'init: true' still set?"
            exit 1
          fi
