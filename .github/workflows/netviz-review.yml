name: netviz review

# A reusable workflow: review a pull request that touches a netviz inventory.
# It draws the change, works out what the change *introduced* as against what
# the base branch already had, and posts one sticky comment that is edited in
# place on every push rather than added to.
#
#     jobs:
#       review:
#         permissions:
#           contents: read
#           pull-requests: write
#           security-events: write
#         uses: blechschmidt/netviz/.github/workflows/netviz-review.yml@main
#         with:
#           inventory: inventory
#
# The full input table, the shape of the comment and the reasoning behind the
# permissions are in docs/ci.md, under "Workflow: review a pull request".
#
# ---------------------------------------------------------------------------
# Why ``pull_request`` and never ``pull_request_target``
# ---------------------------------------------------------------------------
#
# This workflow is meant to be called from a ``pull_request`` trigger. That
# trigger checks out the *merge result* and hands the job a token that is
# read-only for a pull request from a fork -- which is the whole of the defence
# here, because everything below reads YAML the pull request wrote.
#
# ``pull_request_target`` would run the base branch's workflow with a *writable*
# token while the untrusted head is one ``git checkout`` away. Every published
# escape from that pattern has the same shape: something in the job reads a file
# the pull request controls, and the token it is holding can push to the default
# branch. netviz parses the head's YAML by design, so that pattern is exactly
# what it must not be run under, and no amount of care in this file would make
# it safe for a repository that later adds one more step.
#
# The cost is that a fork's pull request cannot be commented on, because
# GitHub gives it a read-only token whatever ``permissions:`` says. The jobs
# below handle that by *degrading*, never by failing: the whole review is
# written to the job summary, which needs no permission at all, and the comment
# and the code-scanning upload are skipped with a note in the log. A maintainer
# reading the run sees the same review a comment would have carried.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Where the job runs. A single label ("ubuntu-latest", "self-hosted"),
          or a JSON array of labels ('["self-hosted", "linux", "x64"]'), or a
          JSON runner group object.
        type: string
        required: false
        default: ubuntu-latest
      inventory:
        description: Root folder of the YAML inventory tree, or a single YAML file.
        type: string
        required: false
        default: "."
      base:
        description: >-
          The state to compare against. Empty is the pull request's base commit,
          which is what a review wants; set it to a branch or a folder to review
          against something else.
        type: string
        required: false
        default: ""
      title:
        description: >-
          Heading of the comment, and the key of its sticky marker. Two
          inventories reviewed in one repository need two titles, or the second
          job will overwrite the first job's comment.
        type: string
        required: false
        default: netviz
      layer:
        description: >-
          Which layer the diff is drawn at: l1, l2, l3, physical, overlay,
          routing, rack, power, identity. One only -- a diff compares one view.
        type: string
        required: false
        default: ""
      theme:
        description: Stylesheet for the diagram, a built-in name or a path.
        type: string
        required: false
        default: ""
      args:
        description: >-
          Further 'netviz diff' flags, split on whitespace -- '--icons cisco
          --no-show-ips'.
        type: string
        required: false
        default: ""
      formats:
        description: >-
          Image formats to draw the diff in, separated by commas. Empty draws
          none, which needs no Graphviz and leaves the comment with its inline
          Mermaid summary alone.
        type: string
        required: false
        default: svg,png
      strict:
        description: Promote every warning to an error, on both sides of the comparison.
        type: boolean
        required: false
        default: false
      disable:
        description: Rule ids to silence on both sides, separated by commas or whitespace.
        type: string
        required: false
        default: ""
      comment:
        description: >-
          Post the review as a comment. False writes it to the job summary only,
          which is what a repository that would rather not have a bot in its
          conversations wants.
        type: boolean
        required: false
        default: true
      upload-sarif:
        description: >-
          Upload the head state's findings to code scanning, so they appear
          against the lines they are about in the Files-changed view.
        type: boolean
        required: false
        default: true
      sarif-category:
        description: >-
          Code-scanning category. One per inventory: uploads sharing a category
          replace each other, so two inventories in one repository need two.
        type: string
        required: false
        default: netviz
      fail-on-new-errors:
        description: >-
          Fail the check when this change introduces an error the base did not
          have. Errors the base already had never fail it -- that is what lets a
          repository with a legacy finding adopt this without a red baseline.
        type: boolean
        required: false
        default: true
      artifact-name:
        description: Name of the uploaded bundle -- the diagrams, the changeset and the SARIF.
        type: string
        required: false
        default: netviz-review
      artifact-retention-days:
        description: How long to keep it. 0 leaves the repository's own default.
        type: number
        required: false
        default: 0
      python-version:
        description: >-
          Interpreter to set up with actions/setup-python. Empty skips that step
          and uses the python already on the runner.
        type: string
        required: false
        default: "3.12"
      version:
        description: >-
          netviz to install, as a pip requirement (netviz==0.0.2, a URL).
          Empty installs the checkout the action came from.
        type: string
        required: false
        default: ""
      graphviz:
        description: >-
          Install the Graphviz 'dot' binary: auto (only when it is missing),
          true or false.
        type: string
        required: false
        default: auto
    outputs:
      verdict:
        description: "One of: passed, warned, failed, broken."
        value: ${{ jobs.review.outputs.verdict }}
      changed:
        description: "'true' when the pull request touches the network at all."
        value: ${{ jobs.review.outputs.changed }}
      new-errors:
        description: How many errors the change introduced that the base did not have.
        value: ${{ jobs.review.outputs.new-errors }}
      comment-url:
        description: The comment that was posted or edited. Empty when none was.
        value: ${{ jobs.review.outputs.comment-url }}

# What the *called* workflow asks for is capped by what the caller granted, so
# these are the floor rather than the ceiling. ``pull-requests: write`` is what
# posts the comment and ``security-events: write`` what uploads the SARIF;
# neither is granted to a fork's pull request whatever is written here, and the
# job degrades rather than failing when it finds that out.
permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  review:
    name: review the change
    # A hyphen is an operator in the expression language, so a property whose
    # name contains one has to be read with the index syntax. ``runs-on`` is the
    # name a workflow author expects, so the awkwardness lives here.
    runs-on: >-
      ${{ fromJSON((startsWith(inputs['runs-on'], '[') || startsWith(inputs['runs-on'], '{'))
                   && inputs['runs-on']
                   || format('"{0}"', inputs['runs-on'])) }}

    permissions:
      contents: read
      pull-requests: write
      security-events: write

    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
      changed: ${{ steps.review.outputs.changed }}
      new-errors: ${{ steps.review.outputs.new-errors }}
      comment-url: ${{ steps.comment.outputs.url }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The base commit is fetched by the action, one object deep, so the
          # default shallow checkout is enough and a repository with a long
          # history does not pay for a full clone on every pull request.
          fetch-depth: 1

      - name: Set up Python
        if: inputs.python-version != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      # The review below is netviz's own composite action, and it has to be
      # the copy that belongs to *this* file: a workflow pinned at v0.0.2 that
      # reached for the action on ``main`` would be pinned in name only.
      # ``github.job_workflow_sha`` is the commit of the reusable workflow being
      # run, which is exactly the ref the caller chose.
      - name: Check out netviz itself
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: blechschmidt/netviz
          ref: ${{ github.job_workflow_sha }}
          path: .netviz
          fetch-depth: 1
          # Nothing here pushes; the token that came with the checkout above is
          # the caller's, and it has no business being left in a second one.
          persist-credentials: false

      - name: Review the change
        id: review
        uses: ./.netviz/.github/actions/netviz-review
        with:
          inventory: ${{ inputs.inventory }}
          base: ${{ inputs.base != '' && inputs.base || github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          title: ${{ inputs.title }}
          layer: ${{ inputs.layer }}
          theme: ${{ inputs.theme }}
          diagram-args: ${{ inputs.args }}
          formats: ${{ inputs.formats }}
          strict: ${{ inputs.strict }}
          disable: ${{ inputs.disable }}
          artifact-name: ${{ inputs.artifact-name }}
          graphviz: ${{ inputs.graphviz }}
          version: ${{ inputs.version }}
          # The step never fails here. The comment, the artifact and the SARIF
          # all have to be published before anything is allowed to go red, or
          # the one run that had something to say says nothing.
          fail-on-new-errors: "false"

      # Uploaded before the comment: the comment links the run's artifact list,
      # and a reader who follows that link the moment the comment appears should
      # find the drawing already there.
      - name: Upload the review bundle
        id: bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ steps.review.outputs.directory }}
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact-retention-days > 0 && inputs.artifact-retention-days || '' }}

      # Always, and first: the job summary needs no permission at all, so it is
      # the one place the review is certain to appear -- including on a fork's
      # pull request, where the two steps below cannot run.
      - name: Write the review to the job summary
        shell: bash
        env:
          COMMENT: ${{ steps.review.outputs.comment }}
        run: |
          set -euo pipefail
          cat "${COMMENT}" >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload the SARIF report
        # A fork's pull request cannot write security events; skipping is the
        # documented behaviour, and the summary above still carries the findings.
        if: >-
          inputs.upload-sarif
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.review.outputs.sarif }}
          category: ${{ inputs.sarif-category }}

      - name: Post the review comment
        id: comment
        # Same test as the SARIF upload, for the same reason: a fork's token is
        # read-only whatever ``permissions:`` above says.
        if: >-
          inputs.comment
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ steps.review.outputs.comment }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # The marker is the body's own first line -- an HTML comment netviz
          # wrote, keyed by the review's title. Reading it back rather than
          # rebuilding it here means the two spellings cannot drift, and a title
          # holding something awkward is already dealt with by the renderer.
          marker="$(head -n 1 "${COMMENT}")"
          case "${marker}" in
            "<!-- netviz-review:"*) ;;
            *)
              echo "::error::${COMMENT} does not start with a netviz review marker"
              exit 1
              ;;
          esac

          # No jq: python is a prerequisite of the action this job already ran,
          # and jq is not on every self-hosted runner. gh --paginate merges the
          # pages of a JSON array response into one array.
          # Into RUNNER_TEMP and not the workspace: this job runs in the
          # caller's checkout, and a review must not leave a file in the tree it
          # is reviewing.
          comments="${RUNNER_TEMP}/netviz-review-comments.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" >"${comments}"
          existing="$(NETVIZ_MARKER="${marker}" NETVIZ_COMMENTS="${comments}" python - <<'PYTHON'
          import json
          import os

          marker = os.environ["NETVIZ_MARKER"]
          with open(os.environ["NETVIZ_COMMENTS"], encoding="utf-8") as handle:
              comments = json.load(handle)

          # The oldest wins. Two markers can only exist if a run was interrupted
          # between the search and the post; editing the first keeps the thread
          # in the order the conversation happened rather than moving the review
          # to the bottom every time.
          mine = [c["id"] for c in comments if (c.get("body") or "").startswith(marker)]
          print(mine[0] if mine else "")
          PYTHON
          )"

          if [ -n "${existing}" ]; then
            echo "editing comment ${existing}"
            url="$(gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F "body=@${COMMENT}" --jq .html_url)"
          else
            echo "posting a new comment"
            url="$(gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" \
              -F "body=@${COMMENT}" --jq .html_url)"
          fi
          echo "url=${url}" >>"${GITHUB_OUTPUT}"
          echo "review posted at ${url}"

      # Last, so that everything above has already been published. Only *new*
      # errors reach here: see docs/ci.md on why the delta and not the count.
      - name: Fail on errors this change introduced
        if: inputs.fail-on-new-errors && steps.review.outputs.failed == 'true'
        shell: bash
        env:
          NEW_ERRORS: ${{ steps.review.outputs.new-errors }}
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          set -euo pipefail
          if [ "${VERDICT}" = "broken" ]; then
            echo "::error::the inventory does not load on this branch; see the review"
          else
            echo "::error::this change introduces ${NEW_ERRORS} error(s) the base did not have"
          fi
          exit 1
