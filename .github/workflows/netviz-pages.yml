name: netviz pages

# A reusable workflow: render one inventory as a self-contained interactive HTML
# page and publish it to GitHub Pages. An inventory repository gets a live
# diagram of its own network, rebuilt from the YAML on every push, in eight
# lines of caller:
#
#     jobs:
#       diagram:
#         permissions:
#           contents: read
#           pages: write
#           id-token: write
#         uses: blechschmidt/netviz/.github/workflows/netviz-pages.yml@main
#         with:
#           inventory: inventory
#           layer: l1 l2 l3
#
# The full input table and the reasoning behind the permissions are in
# docs/ci.md, under "Workflow: publish the diagram to GitHub Pages".
#
# Everything the page is made of comes from ``netviz render -f html`` through
# the composite action next door, so what is published is the same artefact
# ``netviz render`` writes on a laptop -- there is no second renderer here to
# drift from the first one.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Where both jobs run. A single label ("ubuntu-latest",
          "self-hosted"), or a JSON array of labels
          ('["self-hosted", "linux", "x64"]'), or a JSON runner group object.
          The point of the input is the network that has an inventory worth
          drawing and no GitHub-hosted runner allowed anywhere near it.
        type: string
        required: false
        default: ubuntu-latest
      inventory:
        description: Root folder of the YAML inventory tree, or a single YAML file.
        type: string
        required: false
        default: "."
      layer:
        description: >-
          Layers to draw, separated by whitespace or commas. More than one is
          worth giving: the HTML page puts a switcher over them, so "l1 l2 l3"
          publishes the cabling, the VLANs and the addressing as one page with
          three views. Empty draws l1 alone.
        type: string
        required: false
        default: ""
      title:
        description: Caption for the diagram. Empty leaves it uncaptioned.
        type: string
        required: false
        default: ""
      theme:
        description: >-
          Stylesheet to apply: blueprint, mono, none, or a path to a
          'kind: theme' document in the inventory.
        type: string
        required: false
        default: ""
      args:
        description: >-
          Further 'netviz render' flags, split on whitespace -- '--icons
          cisco --collapse-depth 1'.
        type: string
        required: false
        default: ""
      strict:
        description: Treat validation warnings as errors and publish nothing (--strict).
        type: boolean
        required: false
        default: false
      page:
        description: >-
          Name of the page inside the published site. Leave it at index.html
          unless the diagram is meant to sit beside something else, because
          Pages serves the site root and nothing else here writes an index.
        type: string
        required: false
        default: index.html
      python-version:
        description: >-
          Interpreter to set up with actions/setup-python. Empty skips that
          step and uses the python already on the runner, which is what a
          self-hosted image without the tool cache needs.
        type: string
        required: false
        default: "3.12"
      version:
        description: >-
          netviz to install, as a pip requirement (netviz==0.0.1, a URL).
          Empty installs the checkout the action came from.
        type: string
        required: false
        default: ""
      ref:
        description: Branch, tag or SHA of the *calling* repository to render. Empty is the default checkout.
        type: string
        required: false
        default: ""
      graphviz:
        description: >-
          Install the Graphviz 'dot' binary: auto (only when it is missing),
          true or false.
        type: string
        required: false
        default: auto
      deploy:
        description: >-
          Publish the page. False builds and uploads the artifact and stops,
          which is what a pull request wants: the render is the gate, and a
          branch that is not merged should not replace the published site.
        type: boolean
        required: false
        default: true
      environment:
        description: Deployment environment. GitHub Pages requires github-pages unless you have configured another.
        type: string
        required: false
        default: github-pages
    outputs:
      page-url:
        description: URL the page was published at. Empty when deploy was false.
        value: ${{ jobs.deploy.outputs.page-url }}

# What the *called* workflow asks for is capped by what the caller granted, so
# these are the floor rather than the ceiling: a caller that forgets
# ``pages: write`` fails in the deploy job with that in the message.
permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  build:
    name: render the inventory
    # A hyphen is an operator in the expression language, so a property whose
    # name contains one has to be read with the index syntax. ``runs-on`` is
    # the name a workflow author expects, so the awkwardness lives here.
    #
    # A JSON array or object is passed through fromJSON so that label sets and
    # runner groups work as well as a single label; anything else is a plain
    # label and is used verbatim.
    runs-on: >-
      ${{ fromJSON((startsWith(inputs['runs-on'], '[') || startsWith(inputs['runs-on'], '{'))
                   && inputs['runs-on']
                   || format('"{0}"', inputs['runs-on'])) }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          # Nothing here reads history; the inventory is what is in the tree.
          fetch-depth: 1

      - name: Set up Python
        if: inputs.python-version != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      # The render below is netviz's own composite action, and it has to be
      # the copy that belongs to *this* file: a workflow pinned at v0.0.1 that
      # reached for the action on ``main`` would be pinned in name only.
      #
      # ``uses:`` cannot take an expression, so the ref cannot be written there.
      # It can be written here, though — ``github.job_workflow_sha`` is the
      # commit of the reusable workflow being run, which is exactly the ref the
      # caller chose — and a local ``./`` action resolves against the workspace
      # this puts it in. That also keeps every ``uses:`` in this file pinned to
      # a commit, which is the rule for anything that can publish.
      - name: Check out netviz itself
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: blechschmidt/netviz
          ref: ${{ github.job_workflow_sha }}
          path: .netviz
          fetch-depth: 1
          # Nothing here pushes; the token that came with the checkout above is
          # the caller's, and it has no business being left in a second one.
          persist-credentials: false

      - name: Render the inventory
        id: render
        uses: ./.netviz/.github/actions/netviz-render
        with:
          inventory: ${{ inputs.inventory }}
          format: html
          output: ${{ runner.temp }}/netviz-site/${{ inputs.page }}
          layer: ${{ inputs.layer }}
          title: ${{ inputs.title }}
          theme: ${{ inputs.theme }}
          args: ${{ inputs.args }}
          strict: ${{ inputs.strict }}
          graphviz: ${{ inputs.graphviz }}
          version: ${{ inputs.version }}

      # Pages runs Jekyll over an artifact that does not say otherwise, which
      # drops anything beginning with an underscore. The rendered page has no
      # such file today; the marker costs nothing and stops that from becoming
      # a rule the renderer has to know about.
      - name: Mark the site as already built
        shell: bash
        run: touch "${{ runner.temp }}/netviz-site/.nojekyll"

      - name: Upload the page
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/netviz-site

  deploy:
    name: publish to GitHub Pages
    if: inputs.deploy
    needs: build
    runs-on: >-
      ${{ fromJSON((startsWith(inputs['runs-on'], '[') || startsWith(inputs['runs-on'], '{'))
                   && inputs['runs-on']
                   || format('"{0}"', inputs['runs-on'])) }}

    # Only this job writes anything, and it writes a deployment. The build job
    # above runs with the read-only default, so a broken inventory cannot
    # publish and a rendering step cannot reach the Pages API.
    permissions:
      pages: write
      id-token: write

    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deployment.outputs.page_url }}

    # Two pushes in quick succession should publish the later one, and neither
    # should be cancelled halfway through a deployment.
    concurrency:
      group: netviz-pages-${{ github.ref }}
      cancel-in-progress: false

    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
