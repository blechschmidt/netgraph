name: Pages

# The demo site: https://blechschmidt.github.io/netviz/
#
# Why this exists: until it did, nothing in the project let a stranger see what
# netviz does without first installing Python *and* Graphviz. What is
# published is the documentation set and, more to the point, every example
# inventory rendered by ``netviz render -f html`` -- the real command, whose
# output is a self-contained interactive page. There is no second front end to
# keep in step with the first one.
#
# The build is ``tools/build_site.py`` and nothing else, so it can be run and
# debugged locally with one command:
#
#     uv sync --extra site && uv run python tools/build_site.py --output site
#
# Two jobs on purpose. ``build`` runs on pull requests as well as on ``main``,
# because a broken site should fail the pull request that broke it rather than a
# deployment nobody is watching; ``deploy`` runs only for ``main``, and only
# after ``build`` produced an artefact.

on:
  push:
    branches:
      - main
    # A tag push is the same commit as the branch push that preceded it, and
    # would publish the same site twice.
    tags-ignore:
      - "**"
  pull_request:
  # So the site can be republished without a commit -- after a Pages setting
  # changes, or to recover from a deployment that failed for an infrastructure
  # reason.
  workflow_dispatch:

# ``build`` needs nothing; ``deploy`` needs the two Pages grants, and asks for
# them itself rather than here, so the build job cannot publish anything.
permissions:
  contents: read

# A second push to ``main`` while the first is deploying should win. Pull
# request builds cancel on force-push like every other check.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every environment here is built by ``uv sync --locked`` from the committed
  # uv.lock, so nothing is resolved at install time; ``UV_COMPILE_BYTECODE``
  # pays the byte-compilation cost once instead of on every invocation below.
  UV_COMPILE_BYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  build:
    name: build the site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The footer names the commit the site was built from, and
          # ``tools/build_site.py`` reads it with ``git rev-parse``. A shallow
          # clone of depth 1 is enough for that and for nothing else here.
          fetch-depth: 1

      # Every demo page is a Graphviz layout. Without this the renders fail and
      # the build fails with them, which is the intended behaviour -- but it
      # would fail for the wrong reason and waste a run to say so.
      - name: Install Graphviz
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes graphviz
          dot -V

      # The published site is a build artefact like any other, so it is built
      # from uv.lock: the same Markdown renderer draws the same pages today and
      # after the next markdown-it-py release, and a diff in what is deployed is
      # then a diff somebody made on purpose.
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install netviz and the site extra, from uv.lock
        run: |
          set -euo pipefail
          uv sync --locked --extra site
          uv pip list

      # The build is where the gate is: tools/build_site.py raises if any
      # example fails to render, if a link points at nothing published, or if
      # the Markdown renderer is missing. Nothing below re-checks it.
      - name: Build the site
        run: |
          set -euo pipefail
          python tools/build_site.py --output site

      # A page count is a weak assertion and a *floor* on it is not: a build
      # that silently rendered nothing but the shell would pass every check
      # above and publish an empty site.
      - name: Confirm the site is not empty
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import sys

          site = pathlib.Path("site")
          pages = sorted(site.rglob("*.html"))
          demos = sorted((site / "demo").glob("*-diagram.html"))
          print(f"{len(pages)} pages, {len(demos)} demo pages")
          if len(pages) < 60:
              sys.exit(f"only {len(pages)} pages were built; the docs set is bigger than that")
          # Five examples today. A floor rather than an equality, so that
          # adding an example is not also a workflow edit.
          if len(demos) < 5:
              sys.exit(f"only {len(demos)} examples were rendered")
          for demo in demos:
              text = demo.read_text(encoding="utf-8")
              if "<svg" not in text:
                  sys.exit(f"{demo} has no diagram in it")
              if not (site / "demo" / demo.name.replace("-diagram", "")).exists():
                  sys.exit(f"{demo} was rendered but never embedded in a page")
          for required in (
              "index.html",
              "style.css",
              ".nojekyll",
              "docs/index.html",
              "demo/index.html",
          ):
              if not (site / required).exists():
                  sys.exit(f"the site has no {required}")
          PY

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    name: publish to GitHub Pages
    # Only ``main``, and only when there is something to publish. A pull request
    # gets the build above as its gate and deploys nothing.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
