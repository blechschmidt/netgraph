name: release

# The file name is not ours to choose. A PyPI trusted publisher is registered
# against an exact workflow *file name*, and PyPI matches the OIDC token's
# ``job_workflow_ref`` claim against it literally -- so the job that uploads has
# to live in a file called ``pypi.yaml`` and nowhere else. Nor can that job be
# hived off into a small reusable workflow of that name and called from a
# ``release.yml``: PyPI does not accept a reusable workflow as a trusted
# publisher at all. The whole release therefore lives in the file the publisher
# names, and ``name: release`` above is what it is called in the Actions list.
#
# Two triggers, and the difference between them is the whole design.
#
# A ``v*`` tag is the real thing: it publishes to PyPI, pushes the container
# image to GHCR, signs both with build provenance and creates the GitHub release.
# None of that can be taken back.
#
# ``workflow_dispatch`` is the dry run. It executes every step above except the
# irreversible ones -- the same checks, the same build, the same clean-virtualenv
# installs on three operating systems, the same two-architecture image -- and
# publishes to TestPyPI instead of PyPI. So the only thing a green dry run leaves
# untested is the upload itself.
#
# The full write-up, including what counts as public API and what to do when a
# job fails half way through, is in docs/releasing.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The floor. Every job that needs more than this says so itself, next to the
# reason -- the ``permissions`` block of a job that publishes is the whole of its
# blast radius, so it is not written once at the top where it would apply to
# jobs that have no business with it.
permissions:
  contents: read

# Never cancel a release in flight. A run stopped after the PyPI upload and
# before the GitHub release leaves a published version with no release notes,
# which is exactly the state this file exists to avoid.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Every environment here is built by ``uv sync --locked`` from the committed
  # uv.lock, so nothing is resolved at install time; ``UV_COMPILE_BYTECODE``
  # pays the byte-compilation cost once instead of on every invocation below.
  UV_COMPILE_BYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  # ``github.repository`` is already lowercase for this project, which is what
  # GHCR requires of a repository name.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # --------------------------------------------------------------------------- #
  # 1. Refuse the release before anything is built
  # --------------------------------------------------------------------------- #
  guard:
    name: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      minor: ${{ steps.check.outputs.minor }}
      prerelease: ${{ steps.check.outputs.prerelease }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ``tools/release.py`` imports nothing but the standard library, so this is
      # only an interpreter -- but it comes from the same uv every other job in
      # the release uses, at the version ``[tool.uv] required-version`` names, so
      # there is one way to get a Python in this file rather than two.
      # ``no-project`` because nothing is installed here: syncing the project
      # would download a closure to run ninety lines of argparse.
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          activate-environment: true
          no-project: true

      # The three facts that have to agree: the tag, the version in
      # pyproject.toml and a dated, non-empty CHANGELOG.md section. The logic is
      # in tools/release.py rather than in bash here, because tests/test_release.py
      # drives it against bad input -- a guard only exercised by the release it
      # guards is not a guard.
      #
      # On workflow_dispatch there is no tag, so the version in pyproject.toml is
      # taken as the intended one: a dry run then checks exactly what the next
      # tag will check.
      #
      # ``--repository`` adds the one fact that is not about this tree. The PyPI
      # trusted publisher is registered against a repository *slug*, on a PyPI
      # settings page nothing here can read, and PyPI reports a mismatch only at
      # the upload -- the last step of the last job, after the whole gate has run
      # and the artefacts have been built. v0.0.1 lost three complete runs that
      # way after the netgraph -> netviz rename. So the slug this run actually
      # carries is compared against the registration written down in
      # docs/releasing.md, here, before anything is built.
      - name: Check the tag, the version and the changelog agree
        id: check
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            python tools/release.py check --ref "${GITHUB_REF}" \
              --repository "${REPOSITORY}" --notes release-notes.md
          else
            echo "::notice::dry run -- checking the version in pyproject.toml, no tag involved"
            python tools/release.py check --repository "${REPOSITORY}" --notes release-notes.md
          fi

      - name: Show the notes that will become the release body
        run: |
          set -euo pipefail
          echo "## Release notes for ${{ steps.check.outputs.tag }}" >>"$GITHUB_STEP_SUMMARY"
          cat release-notes.md >>"$GITHUB_STEP_SUMMARY"

      # Carried as an artefact rather than re-extracted later, so the GitHub
      # release body and the changelog cannot end up disagreeing.
      - name: Upload the release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # --------------------------------------------------------------------------- #
  # 2. The whole CI gate, at this exact commit
  # --------------------------------------------------------------------------- #
  #
  # ci.yml called as a reusable workflow, not a copy of a subset of it: "it was
  # green on main" is a different statement from "it is green at this tag", and a
  # release-only copy of the gate is a copy that drifts.
  ci:
    name: ci
    needs: guard
    permissions:
      contents: read
      # The called workflow uploads SARIF for each example inventory. A reusable
      # workflow cannot hold more than its caller grants, so the grant is here.
      security-events: write
    uses: ./.github/workflows/ci.yml

  # --------------------------------------------------------------------------- #
  # 3. Build the distributions
  # --------------------------------------------------------------------------- #
  build:
    name: build
    needs: [guard, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      # ``build`` and ``twine`` come out of uv.lock, from the ``release``
      # dependency group in pyproject.toml, for the reason the note above the
      # second twine check spells out at length: the version of twine that reads
      # a distribution decides which core-metadata versions it will accept, and
      # v0.0.1 lost an irreversible step to a twine that changed underneath it.
      # A pin in a lockfile is the only spelling of "the tooling did not move"
      # that survives a re-run six months later.
      #
      # ``--only-group release`` installs that group and nothing else -- not the
      # project, not its dependencies: this step builds a wheel, it does not run
      # netviz. Nothing about the wheel's own contents comes from here, and the
      # ``verify`` job below deliberately installs it with no lockfile at all.
      - name: Install the build tooling, from uv.lock
        run: |
          set -euo pipefail
          uv sync --locked --only-group release
          uv pip list

      - name: Build the sdist and the wheel
        # ``--no-isolation`` so the backend is the hatchling uv.lock pins rather
        # than one resolved fresh inside a throwaway build environment. The
        # ``release`` group installed above carries it for exactly this line; see
        # the note beside it in pyproject.toml.
        run: |
          set -euo pipefail
          python -m build --no-isolation
          ls -la dist/

      # ``--strict`` turns a README that PyPI would render badly into a failure
      # rather than a page nobody notices is broken.
      - name: twine check --strict
        run: twine check --strict dist/*

      # The check above ran the *newest* twine, because the step before it
      # installed one. The upload will be checked a second time by the twine
      # inside pypa/gh-action-pypi-publish -- and that is a Docker action, so
      # pinning it pins its twine, its ``packaging`` and therefore the set of
      # core-metadata versions it is willing to read.
      #
      # v0.0.1 lost a run to exactly that gap. hatchling began emitting
      # ``Metadata-Version: 2.5``; the newest twine here read it happily, PyPI
      # accepts it, and the year-old twine in the pinned image called it
      # ``InvalidDistribution`` at the upload -- the first irreversible step,
      # after the whole gate had already passed.
      #
      # So the artefacts are checked once more by the very image that will check
      # them at the upload. The pin is read out of this file rather than written
      # again, so the two cannot drift apart.
      - name: twine check, with the twine the publisher itself will run
        run: |
          set -euo pipefail
          # ``|| true`` so that "no pin" reaches the message below rather than
          # aborting the step on pipefail with nothing said.
          pin="$(grep -om1 'pypa/gh-action-pypi-publish@[0-9a-f]\{40\}' \
            .github/workflows/pypi.yaml | cut -d@ -f2 || true)"
          if [ -z "$pin" ]; then
            echo "::error::no pypa/gh-action-pypi-publish pin found in this workflow"
            exit 1
          fi
          image="ghcr.io/pypa/gh-action-pypi-publish:${pin}"
          echo "checking dist/ with the twine in ${image}"
          docker run --rm -v "${PWD}/dist:/dist:ro" --entrypoint twine "$image" \
            check /dist/*

      # A wheel whose file name disagrees with the tag is the failure mode the
      # guard job cannot see: it checks the source, this checks the artefact.
      - name: Confirm the artefacts carry the released version
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=(dist/*)

          wheel="dist/netviz-${VERSION}-py3-none-any.whl"
          sdist="dist/netviz-${VERSION}.tar.gz"
          for expected in "$wheel" "$sdist"; do
            if [ ! -s "$expected" ]; then
              echo "::error::expected ${expected}; dist/ holds: ${built[*]}"
              exit 1
            fi
          done

          # Exactly two files: a stale artefact from a cached build directory
          # would otherwise be uploaded and published alongside the real ones.
          if [ "${#built[@]}" -ne 2 ]; then
            echo "::error::dist/ holds ${#built[@]} files, expected 2: ${built[*]}"
            exit 1
          fi
          echo "ok: $(basename "$wheel"), $(basename "$sdist")"

      # The SBOM is taken from an environment the wheel was *installed* into
      # rather than from the wheel file, because the interesting content of a
      # netviz SBOM is the dependency closure -- pydantic, PyYAML, click,
      # networkx, Jinja2 and what they pull in -- and a wheel only declares its
      # requirements, it does not resolve them.
      - name: Install the wheel into an environment to be inventoried
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          # The closure comes from uv.lock and the wheel comes from dist/. Doing
          # it in that order is what makes the SBOM mean something twice over: an
          # unlocked resolution would inventory whatever the index published this
          # morning, so re-running this job against the same tag would produce a
          # different bill of materials for the same artefact. ``--no-dev`` is the
          # runtime closure only, which is what ships; ``--no-install-project``
          # leaves netviz out of it so the next line can install the built wheel
          # rather than the source tree it was built from, and ``--no-deps``
          # there keeps the lockfile's versions rather than re-resolving around
          # the wheel's ranges.
          #
          # It is also the same closure the container image carries, because the
          # Dockerfile syncs from this very lockfile -- so the SBOM describes both
          # published artefacts instead of only one of them.
          UV_PROJECT_ENVIRONMENT=sbom-env uv sync --locked --no-dev --no-install-project
          uv pip install --python sbom-env --no-deps "dist/netviz-${VERSION}-py3-none-any.whl"
          uv pip list --python sbom-env

      # anchore/sbom-action writes ``output-file`` with a bare ``writeFileSync``
      # and never creates the directory above it, so a path with a directory in
      # it fails with ENOENT *after* the scan has run -- the scan reports
      # success and the step fails on the write.
      - name: Make somewhere for the SBOM to go
        run: mkdir -p sbom

      - name: Generate a CycloneDX SBOM of the wheel and its closure
        uses: anchore/sbom-action@7b36ad622f042cab6f59a75c2ac24ccb256e9b45 # v0.20.4
        with:
          path: sbom-env
          format: cyclonedx-json
          artifact-name: netviz-${{ needs.guard.outputs.version }}-wheel.cdx.json
          output-file: sbom/netviz-${{ needs.guard.outputs.version }}-wheel.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Check the SBOM names netviz and its dependencies
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json

          [path] = glob.glob("sbom/*-wheel.cdx.json")
          document = json.load(open(path, encoding="utf-8"))
          # Folded, because a distribution's declared name changes case between
          # releases -- Jinja2 became jinja2 in 3.1.3 -- and a release must not
          # fail over that.
          names = {component.get("name", "").lower() for component in document["components"]}
          print(f"{path}: {len(names)} components")
          expected = {"netviz", "pydantic", "pyyaml", "click", "networkx", "jinja2"}
          missing = expected - names
          if missing:
              raise SystemExit(f"::error::the SBOM never names {sorted(missing)}")
          PY

      - name: Upload the distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-wheel
          path: sbom/
          if-no-files-found: error

  # --------------------------------------------------------------------------- #
  # 4. Install what was built, on every platform that is claimed
  # --------------------------------------------------------------------------- #
  #
  # Not "does the repository work" -- ci.yml answered that. This answers "does
  # the *artefact* work", which is a different question and the one that goes
  # wrong on release day: a package missing from the wheel, a data file left out
  # of the sdist, a console script that does not get generated, an sdist that
  # unpacks but does not build.
  #
  # Nothing here touches the checkout except for the dist/ it downloaded, and
  # Graphviz is deliberately *not* installed: ``netviz --version`` must work
  # without it and say so, which is also what a user filing a bug report will run.
  verify:
    name: verify (${{ matrix.os }})
    needs: [guard, build]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "macos-14", "windows-latest"]

    defaults:
      run:
        # Git Bash on Windows, as in ci.yml, so the steps below are written once.
        shell: bash

    steps:
      # This job deliberately does *not* install from uv.lock, and the omission
      # is the check -- it is the one place in the repository that does not, and
      # a reviewer should read that as a decision. What is being tested
      # is whether the published artefact stands up in an environment that has
      # never seen this repository: its dependency ranges resolving, its console
      # script being generated, its package data being present. Handing it a
      # lockfile would answer a question nobody asked -- the lockfile is ours, a
      # user typing ``pip install netviz`` has no copy of it -- and would hide the
      # failure this job exists to find, which is a range that no longer resolves.
      #
      # uv is still what builds the environments below: ``uv venv`` and ``uv pip
      # install`` are a resolver and an installer, not a lockfile, and on three
      # operating systems they are the fast half of a job that runs six of them.
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          activate-environment: true
          no-project: true

      - name: Download the distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Install the wheel into a clean virtualenv and run it
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          uv venv from-wheel
          bin="from-wheel/bin"
          [ "$RUNNER_OS" = "Windows" ] && bin="from-wheel/Scripts"

          uv pip install --python from-wheel "dist/netviz-${VERSION}-py3-none-any.whl"

          # The console script, by name, from the environment's bin directory --
          # not ``python -m netviz``. A wheel can be importable and still ship
          # no entry point, and the entry point is what a user types.
          "$bin/netviz" --version
          "$bin/netviz" version --json >version.json
          "$bin/python" - <<'PY'
          import json
          import os

          report = json.load(open("version.json", encoding="utf-8"))
          expected = os.environ["VERSION"]
          print(json.dumps(report, indent=2))
          if report["netviz"] != expected:
              raise SystemExit(f"::error::the wheel reports {report['netviz']}, expected {expected}")
          if report["schemaVersion"] != 1:
              raise SystemExit(f"::error::unexpected report version {report['schemaVersion']}")
          if not report["python"]["version"]:
              raise SystemExit("::error::the report names no Python version")
          PY

      # Renders a real inventory from a real installed console script, with no
      # checkout involved. ``-f dot`` needs no Graphviz, which is the point: this
      # step must not pass or fail for a reason that has nothing to do with the
      # wheel.
      - name: Draw something with the installed console script
        run: |
          set -euo pipefail
          bin="from-wheel/bin"
          [ "$RUNNER_OS" = "Windows" ] && bin="from-wheel/Scripts"

          "$bin/netviz" init smoke-test
          "$bin/netviz" --inventory smoke-test validate --strict
          "$bin/netviz" --inventory smoke-test render -f dot -o smoke.dot
          if ! grep -q "digraph\|graph " smoke.dot; then
            echo "::error::the render produced no DOT graph"
            cat smoke.dot
            exit 1
          fi
          echo "ok: $(wc -c <smoke.dot) bytes of DOT"

      # The sdist, installed the same way. ``pip install <sdist>`` runs the build
      # backend, so this is also the check that the sdist *builds* -- an sdist
      # that unpacks but cannot be built is the classic release-day surprise, and
      # PyPI will happily host one.
      - name: Build and install the sdist in a clean virtualenv
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          uv venv from-sdist
          bin="from-sdist/bin"
          [ "$RUNNER_OS" = "Windows" ] && bin="from-sdist/Scripts"

          uv pip install --python from-sdist "dist/netviz-${VERSION}.tar.gz"

          reported="$("$bin/netviz" --version | head -n 1)"
          echo "$reported"
          if [ "$reported" != "netviz ${VERSION}" ]; then
            echo "::error::the sdist install reports '${reported}', expected 'netviz ${VERSION}'"
            exit 1
          fi

  # --------------------------------------------------------------------------- #
  # 5. Publish
  # --------------------------------------------------------------------------- #
  #
  # From here on the work is irreversible, which is why every check is above.
  pypi:
    name: pypi
    needs: [guard, verify]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Named so the PyPI trusted publisher can be scoped to it: without the
    # environment, any workflow in this repository could mint an upload token.
    environment:
      name: pypi
      url: https://pypi.org/project/netviz/${{ needs.guard.outputs.version }}
    permissions:
      # The OIDC token the runner exchanges for a short-lived upload token. This
      # is the whole reason no PyPI credential is stored in this repository:
      # there is nothing here to leak, and nothing to rotate.
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Deliberately *not* skip-existing: a version already on PyPI means the
          # release is being run twice and the second run must stop, loudly.
          skip-existing: false
          print-hash: true

  testpypi:
    name: testpypi (dry run)
    needs: [guard, verify]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/netviz/
    permissions:
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # Unlike the real upload: dry-running the same version twice is a
          # normal thing to do and must not fail.
          skip-existing: true
          print-hash: true

  # --------------------------------------------------------------------------- #
  # 6. Provenance for the Python artefacts
  # --------------------------------------------------------------------------- #
  #
  # A separate job so that ``attestations: write`` is held by nothing that also
  # builds. ``gh attestation verify netviz-X.Y.Z-py3-none-any.whl --repo
  # blechschmidt/netviz`` then ties a downloaded file to this repository, this
  # workflow and this commit.
  provenance:
    name: provenance
    needs: [guard, verify, pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Attest the sdist and the wheel
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  # --------------------------------------------------------------------------- #
  # 7. The container image
  # --------------------------------------------------------------------------- #
  #
  # container.yml called as a reusable workflow, for the same reason ``ci`` above
  # is: the image a release publishes and the image every commit publishes must
  # be built by the same file, or the release is the one build that nothing has
  # rehearsed. It is also what keeps the two off each other's toes -- a ``v*``
  # tag reaches container.yml through here and nowhere else, so exactly one run
  # builds the commit and exactly one pushes ``1.2.3``.
  #
  # The version tags come from the ref, so nothing about the version is passed
  # down for them -- the tag that triggered this run is their only source, and
  # cannot disagree with an argument sent alongside it. What *is* passed is the
  # handful of things this workflow knows and that one cannot: whether this is a
  # real release or a dry run, whether the version has earned ``latest`` -- a
  # pre-release has not -- and the version itself, which names the standalone
  # SBOM the GitHub release attaches and marks the image a release build.
  image:
    name: image
    needs: [guard, ci, verify]
    permissions:
      contents: read
      # A reusable workflow cannot hold more than its caller grants, so the whole
      # of the image job's blast radius is declared here: the GHCR write, and the
      # OIDC token and attestation write that its provenance needs.
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/container.yml
    with:
      push: ${{ github.event_name == 'push' }}
      latest: ${{ github.event_name == 'push' && needs.guard.outputs.prerelease == 'false' }}
      sbom-artifact: sbom-image
      version: ${{ needs.guard.outputs.version }}

  # --------------------------------------------------------------------------- #
  # 8. The GitHub release
  # --------------------------------------------------------------------------- #
  #
  # Last, so that a release exists only once the thing it describes has been
  # published. Re-runnable: ``--clobber`` and the create-or-edit branch below mean
  # a failure here is the one failure in this workflow that costs nothing.
  github-release:
    name: github release
    needs: [guard, build, pypi, provenance, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      # To create the release and attach the files. Nothing else in this workflow
      # can write to the repository.
      contents: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Download the release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: notes

      - name: Download the SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sbom-*
          path: sbom
          merge-multiple: true

      # The body is the changelog section verbatim, plus the two things a
      # changelog cannot know: how to install this exact version, and the digest
      # that was actually published.
      - name: Assemble the release body
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          MINOR: ${{ needs.guard.outputs.minor }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          {
            cat notes/release-notes.md
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "pip install netviz==${VERSION}"
            echo "pipx install netviz==${VERSION}"
            echo "uv tool install netviz==${VERSION}"
            echo '```'
            echo
            echo "Or the container image, which already has Graphviz in it:"
            echo
            echo '```bash'
            echo "docker run --rm -v \"\$PWD:/inventory:ro\" ${IMAGE}:${VERSION} validate"
            echo '```'
            echo
            echo "| Image | Value |"
            echo "|---|---|"
            echo "| Tags | \`${VERSION}\`, \`${MINOR}\`, \`latest\` |"
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo
            echo "## Provenance"
            echo
            echo "The wheel, the sdist and the image carry build provenance attestations."
            echo "Verify a download before trusting it:"
            echo
            echo '```bash'
            echo "gh attestation verify netviz-${VERSION}-py3-none-any.whl --repo ${GITHUB_REPOSITORY}"
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "SBOMs for the wheel's dependency closure (CycloneDX) and for the image (SPDX)"
            echo "are attached below."
          } >body.md
          cat body.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job downloads three artifacts and never checks the repository
          # out, so ``gh`` has no git remote to infer the repository from and
          # every command below dies on "fatal: not a git repository" -- which
          # is what v0.0.3 failed on, after the wheel had already gone to PyPI.
          # Naming it explicitly is cheaper than a checkout nothing else needs.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.guard.outputs.tag }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "netviz ${VERSION}" --notes-file body.md --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          # Create, or -- when this job is being re-run after a failure further
          # down -- update what is already there. Either way the body and the
          # assets end up as this run produced them.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::${TAG} already has a release; updating it"
            gh release edit "$TAG" --title "netviz ${VERSION}" --notes-file body.md
            gh release upload "$TAG" dist/* sbom/* --clobber
          else
            gh release create "$TAG" "${flags[@]}" dist/* sbom/*
          fi

          gh release view "$TAG"
