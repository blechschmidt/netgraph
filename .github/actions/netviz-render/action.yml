name: netviz render
description: >-
  Render a netviz YAML inventory as a diagram -- a self-contained interactive
  HTML page by default, or any other format netviz render writes.
author: netviz contributors

branding:
  icon: git-branch
  color: blue

inputs:
  inventory:
    description: Root folder of the YAML inventory tree, or a single YAML file.
    required: false
    default: "."
  format:
    description: >-
      What to draw: html, svg, png, pdf, dot, mermaid or json. html is one
      self-contained page with the diagram, the layer switcher and the search
      box in it, which is what makes it publishable as-is.
    required: false
    default: html
  output:
    description: >-
      Where to write the diagram. Parent directories are created. Defaults to
      ${RUNNER_TEMP}/netviz.<extension>, which is enough when a later step
      only reads the 'file' output.
    required: false
    default: ""
  layer:
    description: >-
      Which layers to draw, separated by whitespace or commas: l1, l2, l3,
      physical, overlay, routing, rack, power, identity. More than one is only
      meaningful for html, which draws each and puts a switcher over them.
      Empty leaves netviz's own default (l1).
    required: false
    default: ""
  title:
    description: Caption for the diagram. Empty leaves it uncaptioned.
    required: false
    default: ""
  theme:
    description: >-
      Stylesheet to apply: a built-in name (blueprint, mono, none) or a path to
      a 'kind: theme' document. Empty draws with the built-in palette.
    required: false
    default: ""
  args:
    description: >-
      Further 'netviz render' flags, split on whitespace -- '--icons cisco
      --collapse-depth 1 --no-show-ips'. Anything this action does not name an
      input for goes here.
    required: false
    default: ""
  strict:
    description: Treat validation warnings as errors and refuse to draw (--strict).
    required: false
    default: "false"
  force:
    description: >-
      Draw even when validation failed (--force). The diagram may then
      misrepresent the network, which is why it is off by default.
    required: false
    default: "false"
  graphviz:
    description: >-
      Install the Graphviz 'dot' binary, which html, svg, png and pdf are laid
      out by. 'auto' installs it only when the chosen format needs it and the
      runner does not already have it -- so a self-hosted image that ships
      Graphviz is left alone. 'true' always installs, 'false' never does.
    required: false
    default: auto
  install:
    description: >-
      Install netviz before running it. Set to false when an earlier step has
      already installed the version you want.
    required: false
    default: "true"
  version:
    description: >-
      What to install, as a pip requirement (netviz==0.0.2, a URL, a local
      path). Empty installs the checkout this action came from, which is what
      pins the tool to the `rev`/`@ref` the workflow already chose.
    required: false
    default: ""

outputs:
  file:
    description: Path of the diagram that was written.
    value: ${{ steps.render.outputs.file }}
  directory:
    description: >-
      Directory holding it. Hand this to actions/upload-pages-artifact when the
      diagram is the site.
    value: ${{ steps.render.outputs.directory }}
  bytes:
    description: Size of the diagram in bytes.
    value: ${{ steps.render.outputs.bytes }}

runs:
  using: composite
  steps:
    # Graphviz is not a Python dependency: netviz runs the ``dot`` binary. A
    # missing one is reported clearly by the CLI, but by then the job has
    # already installed everything else to find out.
    - name: Install Graphviz
      id: graphviz
      if: inputs.graphviz != 'false'
      shell: bash
      env:
        NETVIZ_GRAPHVIZ: ${{ inputs.graphviz }}
        NETVIZ_FORMAT: ${{ inputs.format }}
      run: |
        set -euo pipefail

        needs_dot=false
        case "${NETVIZ_FORMAT}" in
          html|svg|png|pdf) needs_dot=true ;;
        esac

        if [ "${NETVIZ_GRAPHVIZ}" = "auto" ]; then
          if [ "${needs_dot}" = "false" ]; then
            echo "format ${NETVIZ_FORMAT} is written by netviz itself; not installing Graphviz"
            exit 0
          fi
          if command -v dot >/dev/null 2>&1; then
            dot -V
            exit 0
          fi
        fi

        # ``runs-on`` is the caller's choice, so this has to cope with whatever
        # it chose rather than assume the Ubuntu image.
        case "${RUNNER_OS:-Linux}" in
          Linux)
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --no-install-recommends --yes graphviz
            elif command -v dnf >/dev/null 2>&1; then
              sudo dnf install --assumeyes graphviz
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache graphviz
            else
              echo "::error::no supported package manager found; install Graphviz on this runner, or set graphviz: false"
              exit 1
            fi
            ;;
          macOS)
            brew install graphviz
            ;;
          Windows)
            choco install graphviz --no-progress --yes
            # choco puts it on the *machine* PATH, which this shell was started
            # before; without this the very next step cannot find dot.exe.
            echo "C:\\Program Files\\Graphviz\\bin" >>"${GITHUB_PATH}"
            export PATH="/c/Program Files/Graphviz/bin:${PATH}"
            ;;
          *)
            echo "::error::unknown runner OS '${RUNNER_OS}'; install Graphviz yourself, or set graphviz: false"
            exit 1
            ;;
        esac
        dot -V

    - name: Install netviz
      if: inputs.install == 'true'
      shell: bash
      env:
        NETVIZ_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "${NETVIZ_VERSION}" ]; then
          target="${NETVIZ_VERSION}"
        else
          # $GITHUB_ACTION_PATH is .github/actions/netviz-render inside the
          # checkout of the repository this action was resolved from, so three
          # levels up is netviz itself -- at exactly the ref the workflow
          # asked for. Installing from PyPI here would silently ignore that.
          target="${GITHUB_ACTION_PATH}/../../.."
        fi

        # uv when the workflow already has one *and* has a virtualenv active --
        # the same installer netviz's own CI uses, and roughly ten times faster
        # on a cold runner. Both halves of the condition are load-bearing: this
        # action runs in other people's repositories, so it cannot require a tool
        # they did not ask for, and ``uv pip install`` into a bare system
        # interpreter is refused on the distributions that mark themselves
        # externally managed. pip is the fallback and is never wrong.
        #
        # Note what is deliberately absent: uv.lock. A lockfile pins *this*
        # repository's development environment; the caller of this action is
        # installing a released netviz into an environment of their own, where
        # our pins would be an imposition and, for the ``version`` input, simply
        # inapplicable. Reproducibility here comes from the caller pinning
        # ``version:``, which is the knob they can actually turn.
        if command -v uv >/dev/null 2>&1 && [ -n "${VIRTUAL_ENV:-}" ]; then
          uv pip install "${target}"
        else
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check "${target}"
        fi
        netviz --version

    - name: Run netviz render
      id: render
      shell: bash
      env:
        NETVIZ_INVENTORY: ${{ inputs.inventory }}
        NETVIZ_FORMAT: ${{ inputs.format }}
        NETVIZ_OUTPUT: ${{ inputs.output }}
        NETVIZ_LAYER: ${{ inputs.layer }}
        NETVIZ_TITLE: ${{ inputs.title }}
        NETVIZ_THEME: ${{ inputs.theme }}
        NETVIZ_ARGS: ${{ inputs.args }}
        NETVIZ_STRICT: ${{ inputs.strict }}
        NETVIZ_FORCE: ${{ inputs.force }}
      run: |
        set -euo pipefail

        # A typo here would otherwise reach the CLI as an unknown value and be
        # reported against a flag the workflow author never wrote.
        case "${NETVIZ_FORMAT}" in
          dot|svg|html|png|pdf|mermaid|json) ;;
          *)
            echo "::error::format must be one of dot, svg, html, png, pdf, mermaid, json, not '${NETVIZ_FORMAT}'"
            exit 2
            ;;
        esac

        output="${NETVIZ_OUTPUT}"
        if [ -z "${output}" ]; then
          case "${NETVIZ_FORMAT}" in
            mermaid) extension="mmd" ;;
            *) extension="${NETVIZ_FORMAT}" ;;
          esac
          output="${RUNNER_TEMP}/netviz.${extension}"
        fi
        # Normalise the separators once, here. On Windows -- where this step is
        # Git Bash -- ``$RUNNER_TEMP`` is ``D:\a\_temp``, and every tool below
        # splits a path on '/' alone: ``dirname`` would answer '.' for a
        # backslashed path and the shape check would look for a file with a
        # very odd name. Python takes either spelling, so netviz is
        # unaffected, and forward slashes are what the outputs report.
        #
        # Through ``tr`` rather than ``${output//\\//}``: the two agree on the
        # bash this was written with and not on the one the Windows runner
        # ships, which read that pattern as a bare '/' and deleted the
        # separators instead of the backslashes.
        output="$(printf '%s' "${output}" | tr '\\' '/')"
        # No mkdir: ``netviz render`` creates the parent of --output itself.
        directory="$(dirname "${output}")"

        args=(--inventory "${NETVIZ_INVENTORY}" render --format "${NETVIZ_FORMAT}" --output "${output}")
        # Split on whitespace and commas, so the list can be written as
        # "l1,l2,l3", as a YAML block scalar, or as one layer per line.
        set -f
        for layer in $(printf '%s' "${NETVIZ_LAYER}" | tr ',' ' '); do
          args+=(--layer "${layer}")
        done
        set +f
        if [ -n "${NETVIZ_TITLE}" ]; then
          args+=(--title "${NETVIZ_TITLE}")
        fi
        if [ -n "${NETVIZ_THEME}" ]; then
          args+=(--theme "${NETVIZ_THEME}")
        fi
        if [ "${NETVIZ_STRICT}" = "true" ]; then
          args+=(--strict)
        fi
        if [ "${NETVIZ_FORCE}" = "true" ]; then
          args+=(--force)
        fi
        # Deliberately word-split, and with globbing off so a '*' in a --name
        # filter reaches netviz instead of matching files in the checkout.
        #
        # That holds everywhere except a Windows runner, where the shell is not
        # the last thing to see the argument: the MSYS runtime Git Bash is built
        # on expands wildcards again when it hands argv to a *native* program.
        # ``MSYS=noglob`` turns that off and also changes how the command line
        # is taken apart, which is a worse trade than the problem. A filter with
        # a wildcard in it belongs in netviz.toml on that platform -- see the
        # action's README.
        set -f
        for word in ${NETVIZ_ARGS}; do
          args+=("${word}")
        done
        set +f

        echo "netviz ${args[*]}"
        netviz "${args[@]}"

        # Exit 0 with bytes on disk still is not proof that a diagram was drawn:
        # every format below has a shape, and a truncated or empty file has to
        # fail here rather than be published.
        if [ ! -s "${output}" ]; then
          echo "::error::netviz render succeeded but wrote nothing to ${output}"
          exit 1
        fi
        case "${NETVIZ_FORMAT}" in
          html) expect="<svg" ;;
          svg) expect="<svg" ;;
          # A cable has no direction, so the DOT is a 'graph' rather than a
          # 'digraph'; the name is netviz's and does not depend on the tree.
          dot) expect="graph netviz" ;;
          mermaid) expect="flowchart" ;;
          json) expect="\"nodes\"" ;;
          # The signature of each, at byte 0. Both are binary, hence the -a and
          # the C locale below: a UTF-8 grep declines to match inside them.
          png) expect="PNG" ;;
          pdf) expect="%PDF" ;;
          *) expect="" ;;
        esac
        if [ -n "${expect}" ] && ! LC_ALL=C grep -qa -- "${expect}" "${output}"; then
          echo "::error::${output} does not look like ${NETVIZ_FORMAT}: no '${expect}' in it"
          exit 1
        fi

        bytes="$(wc -c <"${output}" | tr -d '[:space:]')"
        echo "wrote ${output} (${bytes} bytes)"
        {
          echo "file=${output}"
          echo "directory=${directory}"
          echo "bytes=${bytes}"
        } >>"${GITHUB_OUTPUT}"
