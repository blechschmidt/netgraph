# Membership is written here and nowhere else: a 'user' does not list its
# groups, because two spellings of one fact are how an inventory starts
# disagreeing with itself (§19.2).
apiVersion: netviz.dev/v1alpha1
kind: group
metadata:
  name: admins
  description: Shell on rtr-home and sw-home.
spec:
  members:
    - ana
  gid: 100
---
# Nesting: everyone in 'admins' is in 'household' too, without being listed
# twice. 'netviz list groups' expands it — HOLDS says what this document
# names, PEOPLE says who it actually reaches.
apiVersion: netviz.dev/v1alpha1
kind: group
metadata:
  name: household
  description: Anyone allowed on VLAN 10 and on the NAS shares.
spec:
  members:
    - admins
    - kit
  gid: 101
