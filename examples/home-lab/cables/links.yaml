apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-rtr-sw
  description: Router downlink to the switch
  labels:
    site: home
spec:
  endpoints:
    - rtr-home:lan0
    - sw-home:port1
  medium: copper
  speed: 1Gbps
  category: cat6
  connector: rj45
  length_m: 0.5
  label: H-001
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-sw-desk
  labels:
    site: home
spec:
  endpoints:
    - sw-home:port2
    - pc-desk:eno1
  medium: copper
  speed: 1Gbps
  category: cat6
  connector: rj45
  length_m: 8
  label: H-002
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-sw-nas
  labels:
    site: home
spec:
  endpoints:
    - sw-home:port3
    - srv-nas:eth0
  medium: copper
  speed: 1Gbps
  category: cat6a
  connector: rj45
  length_m: 0.5
  label: H-003
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-sw-dongle
  description: |
    Patch to the desk. The far end is the dongle, not the laptop: the laptop
    hangs off the dongle's USB upstream port instead.
  labels:
    site: home
spec:
  endpoints:
    - sw-home:port4
    - adp-usb-eth:enx001122334455
  medium: copper
  speed: 1Gbps
  category: cat6
  connector: rj45
  length_m: 10
  label: H-004
