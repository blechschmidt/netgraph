apiVersion: netgraph.dev/v1alpha1
kind: computer
metadata:
  name: pc-desk
  description: Desktop workstation in the study
  labels:
    site: home
    role: workstation
    owner: sam
spec:
  vendor: Dell
  model: OptiPlex 7010
  interfaces:
    - name: lo
      type: loopback
      ipv4:
        addresses: [127.0.0.1/8]
      ipv6:
        addresses: ["::1/128"]

    - name: eno1
      type: ethernet
      description: Onboard gigabit port
      mac: 3c:97:0e:20:01:01
      mtu: 1500
      ipv4:
        addresses: [192.168.10.20/24]
      ipv6:
        addresses: [2001:db8:10::20/64]

    - name: wlp1s0
      type: wifi
      description: Disabled - the desk is wired
      enabled: false
      mac: 3c:97:0e:20:01:02
