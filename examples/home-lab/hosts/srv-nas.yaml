apiVersion: netgraph.dev/v1alpha1
kind: server
metadata:
  name: srv-nas
  description: Backup and media server
  labels:
    site: home
    role: storage
    env: prod
spec:
  vendor: Synology
  model: DS923+
  location: Home / hallway cabinet
  interfaces:
    - name: lo
      type: loopback
      ipv4:
        addresses: [127.0.0.1/8]
      ipv6:
        addresses: ["::1/128"]

    - name: eth0
      type: ethernet
      mac: 00:11:32:40:01:01
      mtu: 1500
      ipv4:
        addresses: [192.168.10.10/24]
      ipv6:
        addresses: [2001:db8:10::10/64]
