apiVersion: netgraph.dev/v1alpha1
kind: computer
metadata:
  name: laptop
  description: |
    Ultrabook without a built-in Ethernet port. It reaches the wired network
    through the USB dongle declared in hosts/adp-usb-eth.yaml, so it owns no
    cabled interface of its own.
  labels:
    site: home
    role: laptop
    owner: sam
spec:
  vendor: Lenovo
  model: X1 Carbon Gen 11
  interfaces:
    - name: lo
      type: loopback
      ipv4:
        addresses: [127.0.0.1/8]
      ipv6:
        addresses: ['::1/128']

    - name: wlp0s20f3
      type: wifi
      description: Disabled while docked
      enabled: false
      mac: '8c:8c:aa:30:01:01'
