apiVersion: netviz.dev/v1alpha1
kind: server
metadata:
  name: srv-host-b
  description: >-
    The second host. One sandbox namespace, joined by a veth pair that is
    routed rather than bridged - the other of the two shapes a pair comes in.
spec:
  vendor: Supermicro
  model: SYS-5019C-MR
  interfaces:
    - name: eno1
      type: ethernet
      description: Uplink to sw-lab.
      mtu: 1500
      ipv4:
        addresses:
          - ip: 10.20.0.12
            prefix_length: 24
        gateway: 10.20.0.1
    - name: veth-sbx-h
      type: ethernet
      description: Host end of the sandbox pair, addressed rather than bridged.
      ipv4:
        addresses:
          - ip: 10.32.0.1
            prefix_length: 30
      peer: veth-sbx
    - name: veth-sbx
      type: ethernet
      description: Sandbox end of the pair.
      ipv4:
        addresses:
          - ip: 10.32.0.2
            prefix_length: 30
        gateway: 10.32.0.1
      netns: sandbox
      peer: veth-sbx-h
  forwarding:
    ipv4: true
    ipv6: false
  netns:
    - name: sandbox
      description: Throwaway namespace for testing; routed off the host.

  # A namespace is a whole second stack, so it has its own routing table and its
  # own policy database. netviz places a route by the interface it leaves by:
  # 'dev: veth-sbx' is inside the sandbox, 'dev: eno1' is the host's own stack.
  # Both entries below name 10.30.0.0/24 - the tenants over on srv-host-a - and
  # they are two different answers, which is exactly what two stacks means.
  route_tables:
    - name: sandbox-egress
      id: 100
      description: What the sandbox routes by; nothing outside it looks this up.
  routes:
    # The host reaches srv-host-a's tenant bridge over the lab LAN.
    - prefix: 10.30.0.0/24
      via: 10.20.0.11
      dev: eno1
    # The sandbox reaches the same tenants, but only through its host: its stack
    # has no interface on the lab LAN at all.
    - prefix: 10.30.0.0/24
      via: 10.32.0.1
      dev: veth-sbx
      table: sandbox-egress
  routing_policy:
    - priority: 100
      src: 10.32.0.2/32
      oif: veth-sbx
      action: lookup
      table: sandbox-egress
      description: Traffic the sandbox originates is routed by the sandbox's table.
