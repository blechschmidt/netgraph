apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-rtr-sw
  description: >-
    Routed copper link inside rack r1. No panel: both ends are in the same
    rack.
  labels:
    site: hq
    medium: copper
spec:
  endpoints:
    - rtr-edge-01:ge-0/0/0
    - sw-core-01:GigabitEthernet1/0/1
  medium: copper
  speed: 1Gbps
  length_m: 1
  category: cat6
  connector: rj45
  label: C-001
---
