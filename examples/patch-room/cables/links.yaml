apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: air-lobby
  description: >-
    The association between the ceiling access point and the lobby workstation.
    Not a cable anybody pulls, and modelled as one because it is a link.
  labels:
    site: hq
    medium: wireless
spec:
  endpoints:
    - ap-ceiling-01:wlan0
    - laptop-lobby:wlan0
  medium: wireless
  speed: 1200Mbps
