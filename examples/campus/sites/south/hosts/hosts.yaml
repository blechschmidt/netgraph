apiVersion: netgraph.dev/v1alpha1
kind: computer
metadata:
  name: pc-south-01
  description: Staff workstation, South campus floor 1
  labels:
    site: south
    role: workstation
    env: prod
spec:
  vendor: Dell
  model: OptiPlex 7010
  location: Building C, Suedring 44 / floor 1
  interfaces:
    - name: lo
      type: loopback
      ipv4:
        addresses: [127.0.0.1/8]
      ipv6:
        addresses: ['::1/128']

    - name: eno1
      type: ethernet
      mac: 'b4:96:91:02:10:01'
      mtu: 1500
      ipv4:
        addresses: [10.2.10.51/24]
      ipv6:
        addresses: [2001:db8:2:10::51/64]
---
apiVersion: netgraph.dev/v1alpha1
kind: server
metadata:
  name: srv-south-01
  description: Teaching-lab application server, South campus
