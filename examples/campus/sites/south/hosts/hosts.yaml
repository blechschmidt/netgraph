    site: south
    role: application
    env: prod
spec:
  vendor: HPE
  model: ProLiant DL360 Gen11
  location: Building C, Suedring 44 / MER / U4
  interfaces:
    - name: lo
      type: loopback
      ipv4:
        addresses: [127.0.0.1/8]
      ipv6:
        addresses: ['::1/128']

    - name: eth0
      type: ethernet
      mac: '3c:d9:2b:02:20:01'
      mtu: 1500
      ipv4:
        addresses: [10.2.20.11/24]
      ipv6:
        addresses: [2001:db8:2:20::11/64]
---
