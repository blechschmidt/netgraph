apiVersion: netviz.dev/v1alpha1
kind: switch
metadata:
  name: sw-south-dist-01
  description: |
    Distribution switch for the South campus. It aggregates the access-layer
    trunks, hosts the SVI gateway for every campus VLAN, and reaches the core
    router over a routed (untagged) fibre uplink.
  labels:
    site: south
    role: distribution
    env: prod
spec:
  vendor: Arista
  model: 7050SX3-48YC8
  location: Building C, Suedring 44 / MER / U10
  interfaces:
    - name: br0
      type: bridge
      description: Switching instance carrying the access-layer trunks
      members:
        - Ethernet49/1
        - Ethernet50/1

    - name: Vlan10
      type: vlan
      description: Staff gateway
      ipv4:
        addresses: [10.2.10.1/24]
      ipv6:
        addresses: [2001:db8:2:10::1/64]
      vlan:
        mode: access
        access_vlan: 10
      parent: br0

    - name: Vlan20
      type: vlan
      description: Teaching-lab gateway
      ipv4:
        addresses: [10.2.20.1/24]
      ipv6:
        addresses: [2001:db8:2:20::1/64]
      vlan:
        mode: access
        access_vlan: 20
      parent: br0

    - name: Vlan99
      type: vlan
      description: Management gateway
      ipv4:
        addresses: [10.2.99.1/24]
      vlan:
        mode: access
        access_vlan: 99
      vrf: mgmt
      parent: br0

    - name: Ethernet49/1
      type: ethernet
      description: Fibre trunk to sw-south-acc-01
      mac: '00:1c:73:02:d0:01'
      mtu: 9000
      vlan:
        mode: trunk
        trunk_vlans: [1, 10, 20, 30, 99]
        native_vlan: 1

    - name: Ethernet50/1
      type: ethernet
      description: Fibre trunk to sw-south-acc-02
      mac: '00:1c:73:02:d0:02'
      mtu: 9000
      vlan:
        mode: trunk
        trunk_vlans: [1, 10, 20, 30, 99]
        native_vlan: 1

    - name: Ethernet52/1
      type: ethernet
      description: |
        Routed fibre uplink to rtr-south-core-01. No 'vlan' block: this port
        is a layer-3 interface, not a bridge port.
      mac: '00:1c:73:02:d0:04'
      mtu: 9000
      ipv4:
        addresses: [10.2.0.2/30]
      ipv6:
        addresses: [2001:db8:2::2/64]
  bridge:
    name: br0
    type: customer-vlan-bridge
    address: '00:1c:73:02:d0:ff'
  vlans:
    - id: 10
      name: staff
    - id: 20
      name: lab
    - id: 30
      name: voice
    - id: 99
      name: mgmt
  forwarding:
    ipv4: true
    ipv6: true
  vrfs:
    # Management is a routing instance of its own: the Vlan99 SVI here and the
    # one on every access switch are bound to it, so 10.2.99.0/24 is reachable
    # from the management network and from nowhere else. Nothing in the global
    # table has a route into it.
    - name: mgmt
      rd: '65001:99'
      description: In-band management, south campus
  routes:
    - prefix: 0.0.0.0/0
      via: 10.2.0.1
      dev: Ethernet52/1
      metric: 10
    # The management instance is deliberately not routed off-site.
    - prefix: 0.0.0.0/0
      vrf: mgmt
      blackhole: true
  routing:
    ospf:
      area: 0.0.0.0
      # The uplink and the two SVIs that carry user traffic. Vlan99 is in the
      # 'mgmt' instance and is not in the IGP.
      router_id: 10.2.0.2
      interfaces:
        - Ethernet52/1
        - Vlan10
        - Vlan20
