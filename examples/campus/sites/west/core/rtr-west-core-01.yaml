apiVersion: netviz.dev/v1alpha1
kind: router
metadata:
  name: rtr-west-core-01
  description: |
    Layer-3 core router for the West annexe. It routes between the campus VLANs
    (whose gateways sit on sw-west-dist-01) and carries the two backbone
    fibres of the inter-site ring.
  labels:
    site: west
    role: core
    env: prod
spec:
  vendor: Juniper
  model: MX204
  location: Building F, Weststrasse 9 / MER / U12
  interfaces:
    - name: lo0
      type: loopback
      description: Router ID, IGP and management target
      ipv4:
        addresses: [192.0.2.3/32]
      ipv6:
        addresses: [2001:db8::3/128]

    - name: xe-0/0/0
      type: ethernet
      description: Routed fibre downlink to sw-west-dist-01
      mac: '00:05:86:03:c0:00'
      mtu: 9000
      ipv4:
        addresses: [10.3.0.1/30]
      ipv6:
        addresses: [2001:db8:3::1/64]

    - name: xe-0/0/1
      type: ethernet
      description: Backbone fibre to rtr-north-core-01
      mac: '00:05:86:03:c0:01'
      mtu: 9000
      ipv4:
        addresses: [198.51.100.9/30]
      ipv6:
        addresses: [2001:db8:ff:3::1/64]

    - name: xe-0/0/2
      type: ethernet
      description: Backbone fibre to rtr-south-core-01
      mac: '00:05:86:03:c0:02'
      mtu: 9000
      ipv4:
        addresses: [198.51.100.6/30]
      ipv6:
        addresses: [2001:db8:ff:2::2/64]
  forwarding:
    ipv4: true
    ipv6: true
  route_tables:
    # The lab VLAN is not allowed to share the campus default. It gets a table
    # of its own, and the policy database below is what sends it there; the
    # table on its own changes nothing.
    - name: lab-egress
      id: 100
      description: Everything the lab VLAN and marked traffic leave by
  routes:
    # A discard route for the site summary: every connected /24 is more specific
    # and still wins, so this catches only the parts of 10.3.0.0/16 that are
    # not deployed yet -- which is what stops them following a default route back
    # out over the backbone (RFC 4632 section 5.1).
    - prefix: 10.3.0.0/16
      blackhole: true
      metric: 250
    # The management prefix of the next site round the ring, pinned to the
    # clockwise fibre rather than left to the IGP.
    - prefix: 10.1.99.0/24
      via: 198.51.100.10
      dev: xe-0/0/1
      metric: 200
    # The lab table's own default: anticlockwise round the ring, towards South,
    # rather than whichever way the IGP happens to prefer today.
    - prefix: 0.0.0.0/0
      via: 198.51.100.5
      dev: xe-0/0/2
      table: lab-egress
    - prefix: ::/0
      via: 2001:db8:ff:2::1
      dev: xe-0/0/2
      table: lab-egress
  zones:
    # The two directions traffic can come from, which is what the policy below
    # is written about. lo0 is in neither: traffic to a loopback terminates on
    # the router, and the zone for that is 'local', which nothing is put in.
    - name: campus
      interfaces: [xe-0/0/0]
      description: Everything behind sw-west-dist-01 - the site's VLANs
    - name: backbone
      interfaces: [xe-0/0/1, xe-0/0/2]
      description: The inter-site ring
  firewall:
    description: |
      A campus core routes; it does not police transit, so 'default_forward' is
      'accept' and the rules here are about what terminates on the router and
      what gets marked on the way through.
    default_input: drop
    default_forward: accept
    rules:
      - priority: 10
        ct_state: [established, related]
        action: accept
        description: The return path of everything below, in one line
      - priority: 20
        src_zone: backbone
        dst_zone: local
        protocol: tcp
        dst_ports: ['179']
        action: accept
        description: iBGP from the other two cores
      - priority: 30
        src_zone: campus
        dst_zone: local
        src: 10.3.99.0/24
        protocol: tcp
        dst_ports: ['22']
        action: accept
        description: SSH, from the management VLAN and nowhere else
      # The mark the policy database at priority 110 routes by. It is written
      # *here*, on this router, because a firewall mark does not survive the
      # wire: it is metadata inside one kernel and it is gone the moment the
      # packet leaves. A box that routes by a mark is the box that has to set it.
      - priority: 100
        src_zone: campus
        dst_zone: backbone
        src: 10.3.20.0/24
        protocol: tcp
        dst_ports: ['1194', '51820']
        action: mark
        mark: '0x1'
        description: Lab VPN egress, marked for the lab-egress table
  routing_policy:
    # Which table each packet is routed by, walked lowest priority first --
    # so the refusal is numbered *below* the diversion it would otherwise
    # never be reached past.
    - priority: 90
      src: 10.3.20.0/24
      dst: 10.3.99.0/24
      action: prohibit
      description: The lab reaches no management address, and is told so
    - priority: 100
      src: 10.3.20.0/24
      table: lab-egress
      description: Lab VLAN 20 egresses towards South, whatever the IGP says
    - priority: 110
      fwmark: '0x1'
      table: lab-egress
      description: And so does anything 'spec.firewall' marked as lab traffic
    - priority: 32766
      table: main
      description: Everything else, routed the ordinary way
  routing:
    ospf:
      area: 0.0.0.0
      router_id: 192.0.2.3
      interfaces:
        - lo0
        - xe-0/0/0
        - xe-0/0/1
        - xe-0/0/2
    bgp:
      asn: 65001
      router_id: 192.0.2.3
      neighbors:
        - address: 192.0.2.1
          remote_asn: 65001
          description: iBGP to rtr-north-core-01
        - address: 192.0.2.2
          remote_asn: 65001
          description: iBGP to rtr-south-core-01
