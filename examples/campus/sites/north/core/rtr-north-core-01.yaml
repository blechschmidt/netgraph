apiVersion: netviz.dev/v1alpha1
kind: router
metadata:
  name: rtr-north-core-01
  description: |
    Layer-3 core router for the North campus. It routes between the campus VLANs
    (whose gateways sit on sw-north-dist-01) and carries the two backbone
    fibres of the inter-site ring.
  labels:
    site: north
    role: core
    env: prod
spec:
  vendor: Juniper
  model: MX204
  location: Building A, Hauptstrasse 1 / MER / U12
  interfaces:
    - name: lo0
      type: loopback
      description: Router ID, IGP and management target
      ipv4:
        addresses: [192.0.2.1/32]
      ipv6:
        addresses: [2001:db8::1/128]

    - name: xe-0/0/0
      type: ethernet
      description: Routed fibre downlink to sw-north-dist-01
      mac: '00:05:86:01:c0:00'
      mtu: 9000
      ipv4:
        addresses: [10.1.0.1/30]
      ipv6:
        addresses: [2001:db8:1::1/64]

    - name: xe-0/0/1
      type: ethernet
      description: Backbone fibre to rtr-south-core-01
      mac: '00:05:86:01:c0:01'
      mtu: 9000
      ipv4:
        addresses: [198.51.100.1/30]
      ipv6:
        addresses: [2001:db8:ff:1::1/64]

    - name: xe-0/0/2
      type: ethernet
      description: Backbone fibre to rtr-west-core-01
      mac: '00:05:86:01:c0:02'
      mtu: 9000
      ipv4:
        addresses: [198.51.100.10/30]
      ipv6:
        addresses: [2001:db8:ff:3::2/64]
  forwarding:
    ipv4: true
    ipv6: true
  routes:
    # A discard route for the site summary: every connected /24 is more specific
    # and still wins, so this catches only the parts of 10.1.0.0/16 that are
    # not deployed yet -- which is what stops them following a default route back
    # out over the backbone (RFC 4632 section 5.1).
    - prefix: 10.1.0.0/16
      blackhole: true
      metric: 250
    # The management prefix of the next site round the ring, pinned to the
    # clockwise fibre rather than left to the IGP.
    - prefix: 10.2.99.0/24
      via: 198.51.100.2
      dev: xe-0/0/1
      metric: 200
  routing:
    ospf:
      area: 0.0.0.0
      router_id: 192.0.2.1
      interfaces:
        - lo0
        - xe-0/0/0
        - xe-0/0/1
        - xe-0/0/2
    bgp:
      asn: 65001
      router_id: 192.0.2.1
      neighbors:
        - address: 192.0.2.2
          remote_asn: 65001
          description: iBGP to rtr-south-core-01
        - address: 192.0.2.3
          remote_asn: 65001
          description: iBGP to rtr-west-core-01
