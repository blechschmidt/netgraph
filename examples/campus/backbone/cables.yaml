apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-bb-north-south
  description: |
    Single-mode backbone fibre, north campus to south campus. The three
    backbone links form a ring, so any one of them can fail without
    partitioning the campus.
  labels:
    role: backbone
    medium: fiber
spec:
  endpoints:
    - rtr-north-core-01:xe-0/0/1
    - rtr-south-core-01:xe-0/0/2
  medium: fiber
  speed: 10Gbps
  length_m: 4200
  category: os2
  connector: lc
  label: BB-NS
---
