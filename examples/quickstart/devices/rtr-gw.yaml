apiVersion: netviz.dev/v1alpha1
kind: router
metadata:
  name: rtr-gw
  labels: {site: office}
  annotations:
    # wan0 faces the ISP, which is not an element of this inventory, so it
    # terminates no cable on purpose.
    netviz/ignore: NG-C015
spec:
  vendor: MikroTik
  interfaces:
    - name: wan0
      type: ethernet
      description: ISP hand-off
      mtu: 1500
      ipv4:
        addresses: [203.0.113.2/30]
    - name: lan0
      type: ethernet
      description: Downlink to the switch
      mac: '00:1e:8c:aa:00:01'
      mtu: 1500
      ipv4:
        addresses: [192.168.10.1/24]
      vlan:
        mode: access
        access_vlan: 10
  vlans:
    - id: 10
      name: office
