# Every prefix-overlap conflict the IPAM report knows about, in one tree.
#
#   * 10.20.0.0/24 is configured on VLAN 10 and again on VLAN 30 -> W130.
#     Neither claim contains the other; they collide.
#   * 10.30.0.0/16 on VLAN 20 contains 10.30.7.0/24 on VLAN 40 -> W131.
#     Nesting is normal; nesting across a VLAN boundary is the mask typo.
#
# Every host hangs off one switch, so the topology is connected and each prefix
# holds more than one element: W103, W105 and W121 stay out of the way and the
# two conflicts above are the whole finding list.
apiVersion: netviz.dev/v1alpha1
kind: switch
metadata:
  name: sw-core
spec:
  vlans:
    - id: 10
      name: pod-a
    - id: 20
      name: summary
    - id: 30
      name: pod-b
    - id: 40
      name: nested
  interfaces:
    - name: Ethernet1
      type: ethernet
      mtu: 1500
      vlan: {mode: access, access_vlan: 10}
    - name: Ethernet2
      type: ethernet
      mtu: 1500
      vlan: {mode: access, access_vlan: 10}
    - name: Ethernet3
      type: ethernet
      mtu: 1500
      vlan: {mode: access, access_vlan: 30}
    - name: Ethernet4
      type: ethernet
      mtu: 1500
      vlan: {mode: access, access_vlan: 30}
    - name: Ethernet5
      type: ethernet
      mtu: 1500
      vlan: {mode: access, access_vlan: 20}
    - name: Ethernet6
      type: ethernet
      mtu: 1500
      vlan: {mode: access, access_vlan: 20}
    - name: Ethernet7
      type: ethernet
      mtu: 1500
      vlan: {mode: access, access_vlan: 40}
    - name: Ethernet8
      type: ethernet
      mtu: 1500
      vlan: {mode: access, access_vlan: 40}
---
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-pod-a-1
spec:
  interfaces:
    - {name: eth0, type: ethernet, mtu: 1500, vlan: {mode: access, access_vlan: 10}, ipv4: [10.20.0.11/24]}
---
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-pod-a-2
spec:
  interfaces:
    - {name: eth0, type: ethernet, mtu: 1500, vlan: {mode: access, access_vlan: 10}, ipv4: [10.20.0.12/24]}
---
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-pod-b-1
spec:
  interfaces:
    - {name: eth0, type: ethernet, mtu: 1500, vlan: {mode: access, access_vlan: 30}, ipv4: [10.20.0.21/24]}
---
apiVersion: netviz.dev/v1alpha1
