metadata:
  name: pc-summary-1
spec:
  interfaces:
    - {name: eth0, type: ethernet, mtu: 1500, vlan: {mode: access, access_vlan: 20}, ipv4: [10.30.1.11/16]}
---
apiVersion: netviz.dev/v1alpha1
