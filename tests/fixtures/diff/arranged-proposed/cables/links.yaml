apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-rtr-sw
  description: Router downlink to the switch
  labels:
    site: home
spec:
  endpoints:
    - rtr-home:lan0
    - sw-home:port1
  medium: copper
  speed: 1Gbps
  length_m: 0.5
  category: cat6
  connector: rj45
  label: H-001
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-sw-desk
  labels:
    site: home
spec:
  endpoints:
    - sw-home:port2
    - pc-desk:eno1
  medium: copper
  speed: 1Gbps
  length_m: 8
  category: cat6
  connector: rj45
  label: H-002
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-sw-dongle
  description: |
    Patch to the desk. The far end is the dongle, not the laptop: the laptop
    hangs off the dongle's USB upstream port instead.
  labels:
    site: home
spec:
  endpoints:
    - sw-home:port4
    - adp-usb-eth:enx001122334455
  medium: copper
  speed: 1Gbps
  length_m: 10
  category: cat6
  connector: rj45
  label: H-004
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-sw-ap
  description: PoE run into the hallway ceiling
  labels:
    site: home
spec:
  endpoints:
    - sw-home:port5
    - ap-home:eth0
  medium: copper
  speed: 1Gbps
  length_m: 6
  category: cat6
  connector: rj45
  label: H-005
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: wl-ap-phone
  description: |
    The phone's association to ap-home. A wireless link is not a wire, but it
    is a link: `medium: wireless` joins the two radios, and the SSID, channel
    and band come from the `wireless` blocks at either end.
  labels:
    site: home
spec:
  endpoints:
    - ap-home:wlan0
    - phone:en0
  medium: wireless
