apiVersion: netgraph.dev/v1alpha1
kind: switch
metadata:
  name: ap-attic
  description: |
    Ceiling access point in the hallway, powered over the uplink. It is a
    switch: the radio is a bridge port like any other, and the two SSIDs are
    what it bridges the air into.
  labels:
    site: home
    role: wireless
spec:
  vendor: Ubiquiti
  model: U6-Lite
  location: Home / hallway ceiling
  interfaces:
    - name: br0
      type: bridge
      description: Bridges the radio onto the wired uplink
      members:
        - eth0
        - wlan0

    - name: Vlan10
      type: vlan
      description: In-band management address of the access point
      ipv4:
        addresses: [192.168.10.3/24]
      vlan:
        mode: access
        access_vlan: 10
      parent: br0

    - name: eth0
      type: ethernet
      description: PoE uplink to sw-home
      mac: '78:8a:20:aa:00:01'
      mtu: 1500
      vlan:
        mode: trunk
        trunk_vlans: 10,20
        native_vlan: 10

    - name: wlan0
      type: wifi
      description: 5 GHz radio, two SSIDs
      mac: '78:8a:20:aa:00:10'
      mtu: 1500
      wireless:
        role: ap
        band: 5GHz
        channel: 36
        width_mhz: 80
        tx_power_dbm: 23
        bss:
          - ssid: home
            bssid: '78:8a:20:aa:00:11'
            vlan: 10
            security: wpa3-psk
          - ssid: home-guest
            bssid: '78:8a:20:aa:00:12'
            vlan: 20
            security: wpa2-psk
  bridge:
    name: br0
    type: customer-vlan-bridge
    address: '78:8a:20:aa:00:00'
  vlans:
    - id: 10
      name: home
    - id: 20
      name: guest
      description: Isolated SSID for visitors; carried no further than the uplink
