# The people the network is for, and who may touch it (§19).
#
# Identity is not a network fact, which is exactly why it is worth writing down
# next to one: "who can log into the NAS" is a question the cabling cannot
# answer and the spreadsheet nobody diffs usually does.
apiVersion: netgraph.dev/v1alpha1
kind: user
metadata:
  name: ana
  description: Runs the lab. Holds the only account on the router.
spec:
  full_name: Ana Brandt
  email: ana@example.invalid
  uid: 1000
  ssh_keys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyForTheDocsOnlyAAAAAAAAAAA ana@pc-desk
---
apiVersion: netgraph.dev/v1alpha1
kind: user
metadata:
  name: kit
spec:
  full_name: Kit Brandt
  email: kit@example.invalid
  uid: 1001
---
# A service account, so it is exempt from NG-S016: an account nobody logs in as
# belonging to no group is the normal shape of one, and saying so on each of
# them would drown the people the rule is about.
apiVersion: netgraph.dev/v1alpha1
kind: user
metadata:
  name: backup
  description: Runs the nightly pull from srv-nas. No shell, no password.
spec:
  uid: 900
  type: service
