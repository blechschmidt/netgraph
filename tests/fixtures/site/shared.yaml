# Outside the site on purpose: copying `sites/hq` must not touch it, and the
# cable below must not be pulled into the copy either.
apiVersion: netgraph.dev/v1alpha1
kind: switch
metadata:
  name: sw-shared
  description: A switch every site reaches, and no site owns
spec:
  interfaces:
    - name: port1
      type: ethernet
      mtu: 1500
