# E026 (NG-U002) - an element extends past the top of its rack.
#
# 'sw-b' is 4U at U41 of a 42U cabinet, so it ends at U44 and two of its units
# are above the frame. 'position' is the lowest unit, which is exactly the
# arithmetic this catches.
apiVersion: netgraph.dev/v1alpha1
kind: switch
metadata:
  name: sw-a
  location:
    site: hq
    room: mdf
    rack: r1
    position: 1
    rack_height: 42
spec:
  interfaces:
    - name: port1
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 10
---
apiVersion: netgraph.dev/v1alpha1
kind: switch
metadata:
  name: sw-b
  location:
    site: hq
    room: mdf
    rack: r1
    position: 41
    height: 4
    rack_height: 42
spec:
  interfaces:
    - name: port1
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 10
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - sw-a:port1
    - sw-b:port1
  medium: copper
