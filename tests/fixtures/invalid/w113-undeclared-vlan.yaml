# W113 (NV-V004) - a port references a VLAN the device does not declare.
#
# 'sw-a' knows about VLAN 10 only, but 'Gi0/1' is an access port in VLAN 20.
# 'pc-b' declares no VLAN database at all, so the rule says nothing about it.
apiVersion: netviz.dev/v1alpha1
kind: switch
metadata:
  name: sw-a
spec:
  vlans:
    - id: 10
      name: users
  interfaces:
    - name: GigabitEthernet0/1
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 20
---
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 20
      ipv4:
        addresses: [10.0.0.1/30]
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - sw-a:GigabitEthernet0/1
    - pc-b:eth0
  medium: copper
