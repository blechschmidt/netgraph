# W119 (NG-C012) - the cable terminates on a bundle rather than on a lane.
#
# 'bond0' is logical: the wires land on 'eth0' and 'eth1'. Cabling the aggregate
# draws one link where the inventory means two. The members are marked spare so
# that I002 does not comment on them as well.
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      enabled: false
      mtu: 1500
    - name: eth1
      type: ethernet
      enabled: false
      mtu: 1500
    - name: bond0
      type: lag
      members: [eth0, eth1]
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
---
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/30]
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - pc-a:bond0
    - pc-b:eth0
  medium: copper
