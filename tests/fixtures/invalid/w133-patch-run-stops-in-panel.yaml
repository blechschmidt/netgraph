# W133 (NG-P002) - a front position is patched and its rear one is not.
#
# Half a run: the cable was pulled and the front patched, and the rear position
# the coupler leads to is still empty. 'sw-a:port1' is not connected to
# anything, however patched it looks.
apiVersion: netviz.dev/v1alpha1
kind: switch
metadata:
  name: sw-a
spec:
  interfaces:
    - name: port1
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 10
---
apiVersion: netviz.dev/v1alpha1
kind: patchpanel
metadata:
  name: pp-a
spec:
  ports: 1-4
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-sw-pp
spec:
  endpoints:
    - sw-a:port1
    - pp-a:front/1
  medium: copper
