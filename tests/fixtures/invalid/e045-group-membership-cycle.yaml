# E045 (NV-S012) - group membership closes a loop.
#
# 'everyone' holds 'engineering', which holds 'everyone' back. Neither group has
# a membership that can be listed: expanding either one does not terminate, so
# no consumer of this inventory -- netviz, a directory, or a reader -- can
# answer "who is in this?".
apiVersion: netviz.dev/v1alpha1
kind: group
metadata:
  name: everyone
spec:
  members:
    - engineering
---
apiVersion: netviz.dev/v1alpha1
kind: group
metadata:
  name: engineering
spec:
  members:
    - everyone
