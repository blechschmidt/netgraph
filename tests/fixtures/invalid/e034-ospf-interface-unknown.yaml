# E034 (NG-F010) - OSPF is enabled on an interface the device does not have.
#
# The area is only as wide as the interfaces that run it, so 'eth9' is an
# adjacency that will never come up - and a link that looks like it is in the
# IGP and is not.
apiVersion: netgraph.dev/v1alpha1
kind: router
metadata:
  name: rtr-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
  routing:
    ospf:
      area: 0.0.0.0
      router_id: 192.0.2.1
      interfaces: [eth0, eth9]
---
apiVersion: netgraph.dev/v1alpha1
kind: router
metadata:
  name: rtr-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/30]
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - rtr-a:eth0
    - rtr-b:eth0
  medium: copper
