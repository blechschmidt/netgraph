# W108 (NG-I007) - a loopback interface declares a MAC address.
#
# A software loopback has no medium and therefore no hardware address. The
# 127.0.0.1/8 prefix is the host-scoped one every OS configures, which W112
# exempts.
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-a
spec:
  interfaces:
    - name: lo
      type: loopback
      mac: 00:1e:8c:00:00:01
      ipv4:
        addresses: [127.0.0.1/8]
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
---
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/30]
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - pc-a:eth0
    - pc-b:eth0
  medium: copper
