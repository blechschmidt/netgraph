# W127 (NG-T012) - a tunnel carries traffic in the clear.
#
# GRE encrypts nothing and this one runs over no encrypting tunnel, so every
# packet it carries crosses the underlay readable. GRE runs directly over IP,
# so it has no port for I003 to comment on.
apiVersion: netgraph.dev/v1alpha1
kind: computer
metadata:
  name: pc-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
    - name: gre1
      type: tunnel
      mtu: 1476
      ipv4:
        addresses: [10.9.0.1/30]
---
apiVersion: netgraph.dev/v1alpha1
kind: computer
metadata:
  name: pc-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/30]
    - name: gre1
      type: tunnel
      mtu: 1476
      ipv4:
        addresses: [10.9.0.2/30]
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints: [pc-a:eth0, pc-b:eth0]
  medium: copper
---
apiVersion: netgraph.dev/v1alpha1
kind: tunnel
metadata:
  name: gre-a-b
spec:
  type: gre
  endpoints: [pc-a:gre1, pc-b:gre1]
