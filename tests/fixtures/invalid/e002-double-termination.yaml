# E002 (NV-C005) - one interface is terminated by two cables.
#
# 'pc-a:eth0' takes both cbl-one and cbl-two; a physical port takes one cable.
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/24]
---
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/24]
---
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-c
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.3/24]
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-one
spec:
  endpoints:
    - pc-a:eth0
    - pc-b:eth0
  medium: copper
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-two
spec:
  endpoints:
    - pc-a:eth0
    - pc-c:eth0
  medium: copper
