# W147 (NV-F022) - a policy rule that diverts traffic into a table nothing is in.
#
# The rule matches, the lookup finds nothing, and the packet falls through to
# the next rule -- so the traffic somebody diverted goes exactly where it would
# have gone without the rule. The failure that looks like it works.
apiVersion: netviz.dev/v1alpha1
kind: router
metadata:
  name: rtr-a
spec:
  route_tables:
    - name: lab-egress
      id: 100
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
  routes:
    # In 'main', not in 'lab-egress': the half the rule below needs is missing.
    - prefix: 0.0.0.0/0
      via: 10.0.0.2
      dev: eth0
  routing_policy:
    - priority: 100
      src: 10.20.0.0/16
      table: lab-egress
---
apiVersion: netviz.dev/v1alpha1
kind: router
metadata:
  name: rtr-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/30]
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - rtr-a:eth0
    - rtr-b:eth0
  medium: copper
