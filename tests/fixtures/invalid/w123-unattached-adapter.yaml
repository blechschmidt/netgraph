# W123 (NG-X002) - a dongle is patched into the network but plugged into nothing.
#
# 'adp-a:en0' terminates a cable, so the adapter is in use; without an
# 'attached_to' nothing says which machine it presents that port to.
apiVersion: netgraph.dev/v1alpha1
kind: adapter
metadata:
  name: adp-a
spec:
  form_factor: usb-ethernet
  upstream:
    name: usb0
    type: usb
  interfaces:
    - name: en0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
---
apiVersion: netgraph.dev/v1alpha1
kind: computer
metadata:
  name: pc-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/30]
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - adp-a:en0
    - pc-b:eth0
  medium: copper
