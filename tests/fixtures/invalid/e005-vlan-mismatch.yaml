# E005 (NV-C011) - two directly connected access ports carry different VLANs.
#
# One end is untagged in VLAN 10, the other in VLAN 20, so the link joins two
# different broadcast domains.
apiVersion: netviz.dev/v1alpha1
kind: switch
metadata:
  name: sw-a
spec:
  interfaces:
    - name: GigabitEthernet0/1
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 10
---
apiVersion: netviz.dev/v1alpha1
kind: switch
metadata:
  name: sw-b
spec:
  interfaces:
    - name: GigabitEthernet0/1
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 20
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - sw-a:GigabitEthernet0/1
    - sw-b:GigabitEthernet0/1
  medium: copper
