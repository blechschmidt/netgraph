# E020 (NV-A013) - the first hop is not on-link.
#
# 'pc-a' sits in 10.0.0.0/24 but points its default route at 10.9.9.1. Nothing
# resolves that address: the host would have to route to reach the router that
# tells it how to route.
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/24]
        gateway: 10.9.9.1
---
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/24]
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - pc-a:eth0
    - pc-b:eth0
  medium: copper
