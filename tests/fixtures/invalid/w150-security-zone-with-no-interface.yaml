# W150 (NG-B010) - a declared zone that holds no interface.
#
# A zone is a partition of the device's interfaces. One holding none is empty in
# the strongest sense: no packet can ever be in it, so the rule below -- however
# carefully written -- matches nothing.
apiVersion: netviz.dev/v1alpha1
kind: firewall
metadata:
  name: fw-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
  zones:
    - name: wan
      interfaces: [eth0]
    # The interfaces this was going to hold were never added.
    - name: dmz
  firewall:
    rules:
      - priority: 100
        src_zone: dmz
        dst_zone: wan
        action: accept
---
apiVersion: netviz.dev/v1alpha1
kind: router
metadata:
  name: rtr-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/30]
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - fw-a:eth0
    - rtr-b:eth0
  medium: copper
