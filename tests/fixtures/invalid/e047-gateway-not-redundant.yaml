# E047 - a device promises to keep its gateway under any single failure, and one
# cable carries the whole promise.
#
# The annotation is the claim; the topology is a straight line. Losing the one
# cable between the two loses the gateway, so the claim is false and the fix is
# either a second path or an honest deletion of the annotation.
apiVersion: netgraph.dev/v1alpha1
kind: router
metadata:
  name: rtr-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses:
          - 10.0.0.1/24
---
apiVersion: netgraph.dev/v1alpha1
kind: computer
metadata:
  name: pc-a
  annotations:
    netgraph/redundancy: gateway
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses:
          - 10.0.0.2/24
        gateway: 10.0.0.1
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a
spec:
  endpoints:
    - rtr-a:eth0
    - pc-a:eth0
  medium: copper
