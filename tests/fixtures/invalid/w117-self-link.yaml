# W117 (NG-C004) - both ends of one cable land on the same element.
#
# 'cbl-loop' joins 'sw-a' to itself. Legal - a loopback plug is a real thing -
# but far more often the second endpoint was never edited after a copy.
apiVersion: netgraph.dev/v1alpha1
kind: switch
metadata:
  name: sw-a
spec:
  interfaces:
    - name: port1
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 10
    - name: port2
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 10
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-loop
spec:
  endpoints:
    - sw-a:port1
    - sw-a:port2
  medium: copper
