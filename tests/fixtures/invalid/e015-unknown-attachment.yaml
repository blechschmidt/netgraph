# E015 (NG-X001) - 'attached_to' names an element that is not declared.
#
# Nothing called 'ghost-host' exists, so the renderer drops the attachment edge
# and the dongle is drawn floating. One element means no W121 island to report.
apiVersion: netviz.dev/v1alpha1
kind: adapter
metadata:
  name: adp-a
spec:
  form_factor: usb-ethernet
  upstream:
    name: usb0
    type: usb
    attached_to: ghost-host
  interfaces:
    - name: en0
      type: ethernet
      enabled: false
      mtu: 1500
