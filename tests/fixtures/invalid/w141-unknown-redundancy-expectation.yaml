# W141 - a redundancy annotation names something netgraph does not understand.
#
# 'cooling' is a real thing to want and not a thing this tool can grade, so the
# expectation is reported rather than silently ignored: an annotation nobody
# checks reads exactly like one somebody does.
apiVersion: netgraph.dev/v1alpha1
kind: router
metadata:
  name: rtr-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses:
          - 10.0.0.1/24
---
apiVersion: netgraph.dev/v1alpha1
kind: computer
metadata:
  name: pc-a
  annotations:
    netgraph/redundancy: cooling
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses:
          - 10.0.0.2/24
        gateway: 10.0.0.1
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a
spec:
  endpoints:
    - rtr-a:eth0
    - pc-a:eth0
  medium: copper
