# E017 (NV-T003) - a tunnel endpoint is not an interface of type 'tunnel'.
#
# 'pc-b:eth0' is the physical port the outer packets leave by, not the virtual
# interface the tunnel presents. Only one of the two ends is wrong, so exactly
# one finding is reported.
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
    - name: wg0
      type: tunnel
      mtu: 1420
      ipv4:
        addresses: [10.9.0.1/30]
---
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/30]
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - pc-a:eth0
    - pc-b:eth0
  medium: copper
---
apiVersion: netviz.dev/v1alpha1
kind: tunnel
metadata:
  name: tun-a-b
spec:
  type: wireguard
  endpoints:
    - pc-a:wg0
    - pc-b:eth0
