# E032 (NG-F008) - a static route's next hop is not on-link.
#
# 'rtr-a' is addressed only in 10.0.0.0/30, so nothing resolves 10.9.9.1: the
# router would have to route to reach the next hop that tells it how to route.
apiVersion: netviz.dev/v1alpha1
kind: router
metadata:
  name: rtr-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
  routes:
    - prefix: 192.168.0.0/16
      via: 10.9.9.1
---
apiVersion: netviz.dev/v1alpha1
kind: router
metadata:
  name: rtr-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/30]
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - rtr-a:eth0
    - rtr-b:eth0
  medium: copper
