# W104 (NG-V009) - an access port of a layer-2-only switch carries an IP.
#
# 'sw-a' forwards neither IPv4 nor IPv6, so its management address belongs on a
# 'type: vlan' SVI rather than on the bridge port itself.
apiVersion: netgraph.dev/v1alpha1
kind: switch
metadata:
  name: sw-a
spec:
  interfaces:
    - name: GigabitEthernet0/1
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 10
      ipv4:
        addresses: [10.0.0.1/24]
---
apiVersion: netgraph.dev/v1alpha1
kind: computer
metadata:
  name: pc-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/24]
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - sw-a:GigabitEthernet0/1
    - pc-b:eth0
  medium: copper
