# E027 (NG-U003) - one rack is declared with two different heights.
#
# 'sw-a' says the cabinet is 42U and 'sw-b' says 45U. Until that is settled
# there is no bound 'NG-U002' can trust, and one of the two is probably in a
# different cabinet than its 'rack' claims.
apiVersion: netgraph.dev/v1alpha1
kind: switch
metadata:
  name: sw-a
  location:
    site: hq
    room: mdf
    rack: r1
    position: 1
    rack_height: 42
spec:
  interfaces:
    - name: port1
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 10
---
apiVersion: netgraph.dev/v1alpha1
kind: switch
metadata:
  name: sw-b
  location:
    site: hq
    room: mdf
    rack: r1
    position: 2
    rack_height: 45
spec:
  interfaces:
    - name: port1
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 10
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - sw-a:port1
    - sw-b:port1
  medium: copper
