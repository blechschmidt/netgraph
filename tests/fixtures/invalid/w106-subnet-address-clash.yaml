# W106 (NG-A009) - one address claimed twice inside a subnet.
#
# Both hosts are configured with 10.0.0.1/24, but in different VLANs, so E004 -
# which scopes a duplicate to one broadcast domain - stays quiet. The layer-3
# view has no VLAN column and draws a single 10.0.0.0/24 with two claimants,
# which is what this rule reports.
#
# Each host declares the access VLAN its switch port carries, so E005 is quiet;
# both hosts are cabled, so W103 is; no interface is left unaddressed or
# unconfigured, so W101 is; and the switch holds no address, so W104 is.
apiVersion: netgraph.dev/v1alpha1
kind: switch
metadata:
  name: sw-a
spec:
  interfaces:
    - name: GigabitEthernet0/1
      type: ethernet
      vlan:
        mode: access
        access_vlan: 10
    - name: GigabitEthernet0/2
      type: ethernet
      vlan:
        mode: access
        access_vlan: 20
---
apiVersion: netgraph.dev/v1alpha1
kind: computer
metadata:
  name: pc-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      ipv4:
        addresses: [10.0.0.1/24]
      vlan:
        mode: access
        access_vlan: 10
---
apiVersion: netgraph.dev/v1alpha1
kind: computer
metadata:
  name: pc-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      ipv4:
        addresses: [10.0.0.1/24]
      vlan:
        mode: access
        access_vlan: 20
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-sw
spec:
  endpoints:
    - pc-a:eth0
    - sw-a:GigabitEthernet0/1
  medium: copper
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-b-sw
spec:
  endpoints:
    - pc-b:eth0
    - sw-a:GigabitEthernet0/2
  medium: copper
