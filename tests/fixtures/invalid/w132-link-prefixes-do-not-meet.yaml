# W132 (NV-A012) - an address outside every prefix on its own link.
#
# One cable is one segment, and there is no room for a router inside it. With
# 10.0.0.1/30 facing 192.168.1.1/30 neither end is inside any prefix the other
# declares, so the link carries nothing. Both prefixes are point-to-point, so
# W105 (a subnet with a single member) correctly stays quiet.
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
---
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [192.168.1.1/30]
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - pc-a:eth0
    - pc-b:eth0
  medium: copper
