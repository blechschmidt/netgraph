# E019 (NV-T005) - the 'over' references form a loop.
#
# Each IPsec tunnel claims to run inside the other, so neither ever reaches the
# underlay network. Both types encrypt, which keeps W127 out of the way.
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
    - name: ipsec0
      type: tunnel
      mtu: 1400
      ipv4:
        addresses: [10.9.0.1/30]
    - name: ipsec1
      type: tunnel
      mtu: 1400
      ipv4:
        addresses: [10.9.1.1/30]
---
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/30]
    - name: ipsec0
      type: tunnel
      mtu: 1400
      ipv4:
        addresses: [10.9.0.2/30]
    - name: ipsec1
      type: tunnel
      mtu: 1400
      ipv4:
        addresses: [10.9.1.2/30]
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - pc-a:eth0
    - pc-b:eth0
  medium: copper
---
apiVersion: netviz.dev/v1alpha1
kind: tunnel
metadata:
  name: ipsec-outer
spec:
  type: ipsec
  endpoints:
    - pc-a:ipsec0
    - pc-b:ipsec0
  over: ipsec-inner
---
apiVersion: netviz.dev/v1alpha1
kind: tunnel
metadata:
  name: ipsec-inner
spec:
  type: ipsec
  endpoints:
    - pc-a:ipsec1
    - pc-b:ipsec1
  over: ipsec-outer
