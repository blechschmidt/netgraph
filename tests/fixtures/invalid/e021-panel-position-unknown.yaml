# E021 (NG-P001) - a cable terminates on a position the panel does not have.
#
# 'pp-a' is a four-position panel, so 'front/9' is a hole that was never
# punched. The switch port looks patched and reaches nothing.
apiVersion: netgraph.dev/v1alpha1
kind: switch
metadata:
  name: sw-a
spec:
  interfaces:
    - name: port1
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 10
---
apiVersion: netgraph.dev/v1alpha1
kind: patchpanel
metadata:
  name: pp-a
spec:
  ports: 1-4
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-sw-pp
spec:
  endpoints:
    - sw-a:port1
    - pp-a:front/9
  medium: copper
