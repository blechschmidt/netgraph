# W151 (NG-B011) - an interface outside the partition the device declares.
#
# Once a device divides its interfaces into zones, one left outside is traffic
# the policy cannot name: no rule saying 'from lan' reaches it, and what it gets
# is the chain default.
apiVersion: netviz.dev/v1alpha1
kind: firewall
metadata:
  name: fw-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
    # Added later, and never put in a zone.
    - name: eth1
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.1.1/30]
  zones:
    - name: wan
      interfaces: [eth0]
  firewall:
    rules:
      - priority: 100
        src_zone: wan
        dst_zone: local
        action: drop
---
apiVersion: netviz.dev/v1alpha1
kind: router
metadata:
  name: rtr-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/30]
    - name: eth1
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.1.2/30]
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b-0
spec:
  endpoints:
    - fw-a:eth0
    - rtr-b:eth0
  medium: copper
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b-1
spec:
  endpoints:
    - fw-a:eth1
    - rtr-b:eth1
  medium: copper
