# W153 (NG-B013) - a mark the policy database reads that nothing puts on a packet.
#
# The other half of W152, and the more common shape: the table is filled, the
# rule that routes by the mark is written, and the firewall rule that would have
# marked the traffic is the line that never got typed. A mark does not leave the
# machine, so nothing else can be writing it.
apiVersion: netgraph.dev/v1alpha1
kind: firewall
metadata:
  name: fw-a
spec:
  route_tables:
    - name: uplink-b
      id: 100
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
  zones:
    - name: wan
      interfaces: [eth0]
  firewall:
    rules:
      - priority: 100
        dst_zone: wan
        action: accept
  routes:
    - prefix: 0.0.0.0/0
      via: 10.0.0.2
      dev: eth0
      table: uplink-b
  routing_policy:
    - priority: 100
      fwmark: '0x1'
      table: uplink-b
---
apiVersion: netgraph.dev/v1alpha1
kind: router
metadata:
  name: rtr-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/30]
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - fw-a:eth0
    - rtr-b:eth0
  medium: copper
