# E011 (NV-C006) - the cable's medium disagrees with an endpoint's type.
#
# 'pc-a:wlan0' is a radio, but the cable calls itself copper. A wireless link is
# an association between two radios; a copper run cannot end on one.
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-a
spec:
  interfaces:
    - name: wlan0
      type: wifi
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
---
apiVersion: netviz.dev/v1alpha1
kind: computer
metadata:
  name: pc-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/30]
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints:
    - pc-a:wlan0
    - pc-b:eth0
  medium: copper
