# W126 (NG-T011) - a tunnel's MTU does not fit inside its underlay.
#
# The OpenVPN tunnel asks for 1420 bytes inside a WireGuard tunnel that offers
# 1420 minus 69 bytes of OpenVPN encapsulation. Both types encrypt, and both
# terminate on the same two hosts, so W127 and W125 stay quiet.
apiVersion: netgraph.dev/v1alpha1
kind: computer
metadata:
  name: pc-a
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.1/30]
    - name: wg0
      type: tunnel
      mtu: 1420
      ipv4:
        addresses: [10.9.0.1/30]
    - name: ovpn0
      type: tunnel
      mtu: 1420
      ipv4:
        addresses: [10.10.0.1/30]
---
apiVersion: netgraph.dev/v1alpha1
kind: computer
metadata:
  name: pc-b
spec:
  interfaces:
    - name: eth0
      type: ethernet
      mtu: 1500
      ipv4:
        addresses: [10.0.0.2/30]
    - name: wg0
      type: tunnel
      mtu: 1420
      ipv4:
        addresses: [10.9.0.2/30]
    - name: ovpn0
      type: tunnel
      mtu: 1420
      ipv4:
        addresses: [10.10.0.2/30]
---
apiVersion: netgraph.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-b
spec:
  endpoints: [pc-a:eth0, pc-b:eth0]
  medium: copper
---
apiVersion: netgraph.dev/v1alpha1
kind: tunnel
metadata:
  name: wg-a-b
spec:
  type: wireguard
  endpoints: [pc-a:wg0, pc-b:wg0]
  mtu: 1420
---
apiVersion: netgraph.dev/v1alpha1
kind: tunnel
metadata:
  name: ovpn-a-b
spec:
  type: openvpn
  endpoints: [pc-a:ovpn0, pc-b:ovpn0]
  over: wg-a-b
  mtu: 1420
