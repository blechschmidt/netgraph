# E039 (NV-E012) - the declared load on a PDU exceeds its capacity.
#
# A 500 W server on a strip rated for 100 W. The strip has the outlets for it;
# what it has not got is the amperage.
apiVersion: netviz.dev/v1alpha1
kind: pdu
metadata:
  name: pdu-r1-a
spec:
  outlets: 8
  capacity_watts: 100
---
apiVersion: netviz.dev/v1alpha1
kind: server
metadata:
  name: srv-a
spec:
  interfaces:
    - name: eno1
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 10
  power:
    draw_watts: 500
    inputs:
      - pdu-r1-a:1
---
apiVersion: netviz.dev/v1alpha1
kind: switch
metadata:
  name: sw-a
spec:
  interfaces:
    - name: port1
      type: ethernet
      mtu: 1500
      vlan:
        mode: access
        access_vlan: 10
---
apiVersion: netviz.dev/v1alpha1
kind: cable
metadata:
  name: cbl-a-srv
spec:
  endpoints:
    - sw-a:port1
    - srv-a:eno1
  medium: copper
