[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "netviz"
version = "0.0.1"
description = "Declare network elements in YAML and render them as network graphs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "netviz contributors" }]
keywords = ["network", "topology", "graph", "yaml", "yang", "graphviz"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "click>=8.1",
    "networkx>=3.0",
    "jinja2>=3.1",
    # ``netviz watch``. Imported lazily, so a platform without a prebuilt
    # wheel still gets every other command.
    "watchfiles>=0.21",
    # ``netviz fmt`` only. PyYAML discards comments, blank lines and quoting
    # style while parsing -- which is what makes it fast, and what a formatter
    # cannot do without -- so the fmt path uses a round-trip parser and every
    # other path keeps PyYAML unchanged. Imported lazily too (netviz.cli): it
    # costs ~30 ms of import time and ``validate`` runs in a pre-commit hook.
    # Entry 9 of docs/follow-ups.md records the decision.
    "ruamel.yaml>=0.18",
    # ``tomllib`` is stdlib from 3.11; ``netviz.toml`` needs a reader before that.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # netviz itself runs the ``dot`` binary directly (netviz.render.dot), so
    # this wrapper is not a runtime dependency. The tests use its builder API as
    # an independent second opinion: tests/test_examples.py lays every example
    # out through it, which would not prove much if it shared our code path.
    "graphviz>=0.20",
    # Property-based and fuzz testing (tests/strategies.py, tests/test_properties.py,
    # tests/test_fuzz_loader.py). Test-only: nothing under src/ imports it.
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    # The second opinion on the emitted JSON Schema. tests/test_schema.py checks
    # every example against it with this, deliberately not through pydantic: a
    # schema validated by the library that generated it proves nothing.
    "jsonschema>=4.18",
    # Runs the hooks in .pre-commit-config.yaml; ``pre-commit install`` after
    # installing this extra wires them into git.
    "pre-commit>=3.5",
]
# The headless browser layer, ``tests/test_browser.py``. Deliberately *not* part
# of ``dev``: it pulls a driver and then downloads a browser, which is a hundred
# megabytes a contributor typing ``pytest`` did not ask for. The module skips
# itself — with the command to run — when either half is missing, and
# ``.github/workflows/ci.yml`` has a job that installs both. See docs/testing.md.
# ``tools/build_site.py``, which ``.github/workflows/pages.yml`` runs to publish
# the demo site. One dependency, and a pure-Python one: the documentation is
# CommonMark plus GitHub's tables, and this renders exactly that. Not part of
# ``dev`` for the same reason ``browser`` is not — a contributor typing
# ``pytest`` is not building a website — and ``tests/test_site.py`` skips itself
# when it is absent, with the command to install it.
site = [
    "markdown-it-py>=3.0",
]
browser = [
    "playwright>=1.44",
    # The accessibility gate. Ships axe-core itself, so the check is pinned with
    # the dependency rather than fetched from a CDN at test time -- a gate that
    # can change under you overnight is a gate that fails for reasons nobody
    # changed. tests/test_browser.py skips its axe tests without it.
    "axe-core-python>=0.1",
]

[project.urls]
# The canonical URLs. ``netviz.rules.RULES_DOC_URL`` and the SARIF
# ``informationUri`` are built from the same repository, so a rename has to
# happen here and there at once; ``tests/test_docs.py`` pins the anchors.
Homepage = "https://github.com/blechschmidt/netviz"
Repository = "https://github.com/blechschmidt/netviz"
Issues = "https://github.com/blechschmidt/netviz/issues"

[project.scripts]
netviz = "netviz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netviz"]

[tool.hatch.build.targets.sdist]
# None of these are optional decoration. tests/test_examples.py loads, validates
# and renders every inventory under ``/examples``; tests/test_docs.py reads
# ``/docs`` and executes the generator in ``/tools``; tests/test_schema.py
# compares ``/schema`` against what the models produce; tests/test_integrations.py
# reads the pre-commit hook definitions, the composite action and the workflow
# that exercises it. An sdist without them would ship a test suite that cannot
# pass.
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/tools",
    "/schema",
    # docs/lsp.md documents this as the shipped VS Code client and
    # tests/test_docs.py checks that every link in it resolves.
    "/editors",
    "/.github",
    "/.pre-commit-hooks.yaml",
    "/.pre-commit-config.yaml",
    # tests/test_docker.py asserts these against the CLI the way
    # tests/test_integrations.py does the hooks, so they are here for the same
    # reason as everything above.
    "/Dockerfile",
    "/docker-compose.yml",
    "/.dockerignore",
    "/.env.example",
    "/README.md",
    "/LICENSE",
    # tests/test_release.py reads both: the changelog must have a dated, non-empty
    # section for the version in this file, and the release workflow must keep its
    # actions pinned. Neither check can run from an sdist that omits them.
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# ruff lints and formats Python code blocks embedded in Markdown, which is what
# we want for README.md and docs/schema.md. ``.cloop`` is task-runner
# scaffolding regenerated outside this repo's control, so a snippet pasted into
# one of its files must not be able to fail CI.
extend-exclude = [".cloop"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# The doc generators emit typographic Markdown: en dashes in numeric ranges and
# a "—" for "not applicable" are the intended characters, not confusable typos.
"tools/**" = ["RUF001"]

[tool.mypy]
python_version = "3.10"
files = ["src/netviz", "tests", "tools"]
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["graphviz.*", "networkx.*"]
ignore_missing_imports = true

# Only tools/render_icons.py imports it, and only to regenerate the raster
# icons; it is deliberately not a netviz dependency (it needs system cairo).
[[tool.mypy.overrides]]
module = ["cairosvg"]
ignore_missing_imports = true

# Only installed on Python < 3.11, which is not the interpreter mypy runs under.
[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true

# tests/test_browser.py imports it, and it is in the ``browser`` extra rather
# than in ``dev`` -- so the type-checking job that lints every other test module
# does not have it installed. The module ships type hints, so wherever it *is*
# installed this override changes nothing.
[[tool.mypy.overrides]]
module = ["playwright.*", "axe_core_python.*"]
ignore_missing_imports = true

# ``netviz.loader.documents`` subclasses PyYAML's loaders and calls two methods
# -- ``add_implicit_resolver`` and ``construct_yaml_str`` -- whose annotations
# differ between releases of ``types-PyYAML``. Under one resolution they are
# untyped and the calls need ``# type: ignore[no-untyped-call]``; under another
# they are typed and the same comments are *unused*, which
# ``warn_unused_ignores`` then reports as an error. The module has to type-check
# under both, and neither the comments nor their absence can satisfy both, so
# this is the only setting that does. It is scoped to the one module rather than
# set globally: an unused ignore anywhere else is still a mistake worth hearing
# about, and this narrows the blind spot to three lines whose reason is written
# above them.
[[tool.mypy.overrides]]
module = ["netviz.loader.documents"]
warn_unused_ignores = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Every test in this suite is a function. Collecting classes as well would only
# ever pick up an import -- ``TestSuite`` and ``TestReport`` are netviz types,
# not test cases -- and warn about not being able to instantiate them.
python_classes = []
markers = [
    # tests/test_browser.py. Its own mark so the CI job that installs a browser
    # can select it (``-m browser``) and every other run can leave it out
    # (``-m 'not browser'``) rather than relying on it skipping itself.
    "browser: drives the web interface in a real headless browser (see docs/testing.md)",
]
# Coverage is on by default so that the threshold cannot be forgotten in CI.
# When running a subset of the suite the gate will trip on the untouched
# modules -- pass ``--no-cov`` for those runs, e.g. ``pytest tests/test_dot.py
# --no-cov``.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=netviz",
    "--cov-report=term-missing:skip-covered",
    # Pin the property tests' seed so a run is reproducible. Hypothesis refuses
    # ``derandomize`` alongside an explicit example database (see
    # tests/conftest.py), and the database is the half that makes a discovered
    # failure cheap to re-run -- so determinism is spelled here instead, where a
    # later ``--hypothesis-seed`` on the command line still overrides it.
    "--hypothesis-seed=0",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["netviz"]

[tool.coverage.report]
show_missing = true
# The suite sits well above this; the floor is here to catch a regression, not
# to describe the current state.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
