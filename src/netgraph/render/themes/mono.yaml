# Greyscale, for a diagram that is going to be photocopied, printed on a laser
# printer, or read by somebody who cannot tell the accent hues apart.
#
# Nothing here carries meaning in colour alone: the kind is in the shape and the
# medium is in the line pattern, which is the rule the built-in palette already
# follows and which this theme makes literal by taking the colour away.
apiVersion: netgraph.dev/v1alpha1
kind: theme
metadata:
  name: mono
  description: |
    Black on white. Shape carries the kind and the line pattern carries the
    medium, so the drawing survives a photocopier and a colour-blind reader.
spec:
  rules:
    - style:
        fill: white
        stroke: black
        fontColor: black
        shape: box

    - select:
        kind: [router]
      style:
        shape: diamond
    - select:
        kind: [switch]
      style:
        shape: box3d
    - select:
        kind: [server]
      style:
        shape: cylinder
    - select:
        kind: [computer]
      style:
        shape: rounded
    - select:
        kind: [adapter]
      style:
        shape: ellipse
        dash: dashed
    - select:
        kind: [patchpanel]
      style:
        fill: "#f2f2f2"
    - select:
        kind: [pdu]
      style:
        fill: "#e6e6e6"
    - select:
        kind: [user]
      style:
        shape: ellipse
    - select:
        kind: [group]
      style:
        shape: folder
    - select:
        kind: [subnet]
      style:
        fill: "#f2f2f2"
        shape: rounded
    - select:
        kind: [tunnel]
      style:
        fill: "#e6e6e6"
        shape: hexagon
    - select:
        kind: [namespace]
      style:
        fill: "#e6e6e6"
        shape: folder

    - select:
        kind: [cable]
      style:
        stroke: black
    - select:
        kind: [tunnel]
      style:
        stroke: "#4d4d4d"
        dash: dashed
