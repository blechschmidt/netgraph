# A drawing-office palette: everything on white, in one blue family, with the
# tier a diagram usually wants to show carried by weight rather than by hue.
#
# The rules are ordered least specific first, which is only a convention — the
# resolver sorts by how many conditions a selector states and breaks a tie with
# the later declaration (§22.4) — but it makes the file read the way it works.
apiVersion: netviz.dev/v1alpha1
kind: theme
metadata:
  name: blueprint
  description: |
    Engineering-drawing blue on white. One hue for the data path, amber for
    power, rose for people, and line weight rather than colour for the tiers,
    so it survives a black-and-white print.
spec:
  rules:
    # The background every other rule adjusts.
    - style:
        fill: white
        stroke: "#1e3a8a"
        fontColor: "#1e3a8a"
        shape: box

    - select:
        kind: [router]
      style:
        fill: "#dbe9f6"
        shape: diamond
    - select:
        kind: [switch]
      style:
        fill: "#e0eaf8"
        shape: box3d
    - select:
        kind: [hub]
      style:
        fill: "#eef2f9"
    - select:
        kind: [server]
      style:
        fill: "#e8eefc"
        shape: cylinder
    - select:
        kind: [computer]
      style:
        fill: white
        shape: rounded
    - select:
        kind: [adapter, patchpanel]
      style:
        fill: "#f1f5f9"
        stroke: "#64748b"
        fontColor: "#334155"
        dash: dashed

    # Not the data path: power in amber, identity in rose, both far enough from
    # the blue that a reader never confuses the three views.
    - select:
        kind: [pdu]
      style:
        fill: "#fef3c7"
        stroke: amber
        fontColor: "#78350f"
    - select:
        kind: [user, group]
      style:
        fill: "#fce7f3"
        stroke: pink
        fontColor: "#831843"

    # Derived nodes are not hardware and should not be read as any.
    - select:
        kind: [subnet]
      style:
        fill: "#e0f2f1"
        stroke: teal
        fontColor: "#134e4a"
        shape: rounded
    - select:
        kind: [tunnel]
      style:
        fill: "#ede9fe"
        stroke: violet
        fontColor: "#4c1d95"
        shape: hexagon
    - select:
        kind: [namespace]
      style:
        fill: "#e2e8f0"
        stroke: slate
        shape: folder

    - select:
        kind: [cable]
      style:
        stroke: "#334155"
    - select:
        kind: [tunnel]
        # A tunnel drawn as an edge rather than as a node takes the same violet
        # as the node form, so the two spellings of one tunnel look alike.
      style:
        stroke: violet
        dash: dashed

    # Weight carries the tier. These state one condition each, exactly as the
    # kind rules above do, so they win the tie by being declared last (§22.4)
    # — which is why they are at the bottom of the file.
    - select:
        role: [core]
      style:
        strokeWidth: 3
        fontSize: 12
    - select:
        role: [access]
      style:
        strokeWidth: 1
